<style>

#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(120px);background:#F4F1EA;color:#111;border-radius:999px;padding:10px 8px 10px 16px;font-weight:700;display:flex;align-items:center;gap:10px;transition:transform .25s;z-index:15;white-space:nowrap;box-shadow:0 4px 16px #000a}

#dot{position:fixed;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#999;z-index:30}
.calov{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.calbx{background:#18181D;border-radius:20px;padding:14px;width:100%;max-width:360px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.calh b{font-size:16px}
.calh button{border:0;background:var(--c2,#202026);color:var(--ink,#F4F1EA);width:38px;height:34px;border-radius:999px;font-size:18px;cursor:pointer}.calh button:disabled{opacity:.25}

.calg button{position:relative;border:0;background:none;color:var(--ink,#F4F1EA);height:40px;border-radius:12px;font:600 15px -apple-system,system-ui,sans-serif;cursor:pointer}
.calg button:disabled{opacity:.25}.calg button.td{box-shadow:inset 0 0 0 1.5px var(--acc,#F2B632)}.calg button.on{background:var(--acc,#F2B632);color:#111}
.calg em{position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc,#F2B632)}.calg button.on em{background:#111}
.calt{display:block;width:100%;margin-top:10px;border:0;border-radius:12px;padding:11px;background:var(--c2,#202026);color:var(--acc,#F2B632);font-weight:800;cursor:pointer}
.hoyb{border:0;border-radius:999px;background:var(--acc,#F2B632);color:#111;font:800 13px -apple-system,system-ui,sans-serif;padding:7px 11px;cursor:pointer}
.tgl{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line,#2a2a30);background:var(--card,#16161A);color:inherit;border-radius:14px;padding:13px 14px;font:600 15px -apple-system,system-ui,sans-serif;cursor:pointer;margin-bottom:8px}.tgl b{color:var(--acc,#F2B632);font-size:14px}</style></head><body>
<div id="dot"></div>
<div id="out"></div>
<div id="sh"><div class="bx" id="shb"></div></div>
<div id="toast"><span id="tt"></span><button id="tb">Detalles</button></div>
<script>
const SB="https://tdundqjsixqrddszumly.supabase.co",SBK="sb_publishable_KTvtNJcl64iOH4Hee-3L-Q__vSiCgrP",ROW="sobremi",LK="sobremi-v1";
const KS=["gym-session","entreno-session","pelis-session","series-session"];
const $=id=>document.getElementById(id),J=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0"),ds=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const hh=t=>{const d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())};
const addD=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return ds(x)};
const DIAS=["dom","lun","mar","mié","jue","vie","sáb"],MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const today=()=>ds(Date.now());
const fdl=d=>{if(d===today())return"Hoy";if(d===addD(today(),-1))return"Ayer";const x=new Date(d+"T12:00:00");return DIAS[x.getDay()]+" "+x.getDate()+" "+MES[x.getMonth()]};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const INT=["","Leve","Media","Fuerte"];

/* ---- Datos ---- */
const DEF=[["caca","💩","Caca"],["diarrea","🫟","Diarrea"],["pipi","💧","Pipí"],["cansado","👎","Cansado"],["cabeza","👽","Dolor de cabeza"],["barriga","🤢","Dolor de barriga"],["fiebre","🌡️","Fiebre",1],["triste","😞","Triste"]];
const empty=()=>({btn:DEF.map(a=>({id:a[0],e:a[1],n:a[2],t:a[3]?1:0})),ap:[]});
const NT=["Pensamientos","Anécdotas","Ideas"];
let S=J(LK)||empty();fixS();
function fixS(){if(!Array.isArray(S.btn))S.btn=empty().btn;if(!Array.isArray(S.ap))S.ap=[];if(!Array.isArray(S.no))S.no=[];if(!Array.isArray(S.nt))S.nt=NT.slice()}
const UK=LK+"-at",DK=LK+"-dirty";
const lat=()=>+localStorage.getItem(UK)||0;
function save(){localStorage.setItem(LK,JSON.stringify(S));localStorage.setItem(UK,String(Date.now()));localStorage.setItem(DK,"1");queue()}

/* ---- Nube ---- */
async function tok(){let s=null;KS.forEach(k=>{const v=J(k);if(v&&v.refresh_token&&(!s||(v.expires_at||0)>(s.expires_at||0)))s=v});if(!s)return null;
 if(s.expires_at-60>Date.now()/1000)return s.access_token;
 const r=await fetch(SB+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SBK,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})});const j=await r.json();if(!r.ok)return null;
 const n=JSON.stringify({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(+j.expires_in||3600)});KS.forEach(k=>localStorage.setItem(k,n));return j.access_token}
const dot=s=>$("dot").style.background={ok:"#2e9e4f",pending:"#e0a100",off:"#d33",none:"#999"}[s];
let busy=0,again=0,tm=null;
function queue(){dot("pending");clearTimeout(tm);tm=setTimeout(sync,1000)}
async function sync(){if(busy){again=1;return}busy=1;let st="ok";
 try{const t=await tok();if(!t)throw new Error("nologin");const h={apikey:SBK,Authorization:"Bearer "+t};
  const r=await fetch(SB+"/rest/v1/vista_semanal?id=eq."+ROW+"&select=datos",{headers:h});if(!r.ok)throw new Error("sb");
  const rows=await r.json(),rem=rows.length?rows[0].datos:null,ra=+(rem&&rem.updatedAt)||0,la=lat(),dirty=localStorage.getItem(DK)==="1";
  if(!rem||dirty||la>ra){const at=la||Date.now();
   const p=await fetch(SB+"/rest/v1/vista_semanal",{method:"POST",headers:{...h,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id:ROW,datos:{v:S,updatedAt:at},actualizado_en:new Date().toISOString()})});
   if(!p.ok)throw new Error("sb");localStorage.setItem(UK,String(at));if(lat()===at)localStorage.setItem(DK,"0")}
  else if(ra>la&&rem.v){S=rem.v;fixS();localStorage.setItem(LK,JSON.stringify(S));localStorage.setItem(UK,String(ra));localStorage.setItem(DK,"0");render()}}
 catch(e){st=e.message==="nologin"?"none":"off"}
 busy=0;dot(st==="ok"&&localStorage.getItem(DK)==="1"?"pending":st);if(again){again=0;setTimeout(sync,300)}}
addEventListener("online",sync);document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()});

/* ---- Pantalla ---- */
let OPN=0,V="hoy",DAY=today(),RG=30;try{const g=localStorage.getItem("sobremi-rg");if(g!==null&&!isNaN(+g))RG=+g}catch(e){}
const bOf=id=>S.btn.find(b=>b.id===id);
function apInfo(a){const b=bOf(a.b);return{e:a.e||(b&&b.e)||"📝",n:a.b==="nota"?"Nota":(b&&b.n)||a.n||"—"}}
function render(){const sv=V==="res"?"hoy":V;document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.v===sv));
 if(V==="x"){if(!$("xf")){$("out").innerHTML=`<iframe id="xf" src="x.html?v=21" title="X" style="display:block;width:calc(100% + 24px);margin:0 -12px -40px;border:0;background:#000"></iframe>`}const f=$("xf");f.style.height=(innerHeight-f.getBoundingClientRect().top-window.scrollY)+"px";return}
 $("out").innerHTML=V==="res"?resumen():V==="apu"?apuntes():hoy();if(V==="apu")drawAp()}
function hoy(){
 let h=`<div class="bt">${S.btn.map(b=>`<button data-b="${b.id}"><span class="e">${esc(b.e)}</span><span class="n">${esc(b.n)}</span></button>`).join("")}<button class="add" data-a="addb"><span class="e">＋</span><span class="n">Botones</span></button></div>
 <div class="nt"><textarea id="nota" placeholder="Nota libre…" rows="1"></textarea><button data-a="nota">Guardar</button></div>`;
 const L=S.ap.filter(a=>ds(a.ts)===DAY).sort((a,b)=>b.ts-a.ts);
 h+=`<h2>Del día${DAY<today()?`<button class="hoyb" data-a="hoy" style="margin-left:auto">Hoy</button>`:""}<div class="dn" ${DAY<today()?'style="margin-left:6px"':""}><button data-a="pv">‹</button><span data-a="cal" style="cursor:pointer">${fdl(DAY)} ▾</span><button data-a="nx" ${DAY>=today()?"disabled":""}>›</button></div></h2>`;
 if(L.length){h+=`<button class="tgl" data-a="tgl"><span>${L.length} registro${L.length>1?"s":""}</span><b>${OPN?"Ocultar ▾":"Ver ▸"}</b></button>`;}
 if(L.length&&OPN){const c={};L.forEach(a=>{if(a.b==="nota")return;const k=a.b;c[k]=(c[k]||0)+1});
  const ck=Object.keys(c);if(ck.length)h+=`<div class="cnt">${ck.map(k=>{const i=apInfo(L.find(a=>a.b===k));return`<span>${esc(i.e)} ${c[k]}</span>`}).join("")}</div>`;
  h+=L.map(a=>{const i=apInfo(a),tg=(a.i?`<span class="tg i${a.i}">${INT[a.i]}</span>`:"")+(a.tc?`<span class="tg tt">${String(a.tc).replace(".",",")} °C</span>`:"");
   return`<div class="it" data-id="${a.id}"><span class="e">${esc(i.e)}</span><div class="t"><b>${esc(i.n)}</b>${tg||a.no?`<small>${tg}${esc(a.no||"")}</small>`:""}</div><span class="h">${hh(a.ts)}</span></div>`}).join("")}
 else if(!L.length)h+=`<div class="emp">Sin registros este día.</div>`;
 return h+`<button class="more" data-a="res">Ver resumen</button>`}
function resumen(){const end=today(),AL=S.ap.filter(a=>a.b!=="nota"),first=AL.length?AL.map(a=>ds(a.ts)).sort()[0]:end;
 let from=RG?addD(end,-(RG-1)):first;if(from<first)from=first;const days=[];for(let d=from;d<=end;d=addD(d,1))days.push(d);const ND=days.length;
 const L=AL.filter(a=>ds(a.ts)>=from);
 let h=`<button class="lk" data-a="back" style="margin:-4px 0 8px">‹ Registros</button><div class="chips">${[7,30,90].map(n=>`<button data-rg="${n}" class="${n===RG?"on":""}">${n} días</button>`).join("")}<button data-rg="0" class="${RG===0?"on":""}">Desde el inicio</button></div><div class="ft" style="margin:0 0 10px;text-align:left">Desde el ${new Date(from+"T12:00").toLocaleDateString("es-ES",{day:"numeric",month:"long"})} · ${ND} día${ND>1?"s":""}</div>`;
 const ids=[...new Set(L.map(a=>a.b))].sort((x,y)=>L.filter(a=>a.b===y).length-L.filter(a=>a.b===x).length);
 if(!ids.length)return h+`<div class="emp">Sin apuntes en este periodo.</div>`;
 ids.forEach(id=>{const A=L.filter(a=>a.b===id),i=apInfo(A[0]),n=A.length,dd=new Set(A.map(a=>ds(a.ts))).size;
  const fr=[0,0,0,0];A.forEach(a=>{fr[Math.floor(new Date(a.ts).getHours()/6)]++});const fm=Math.max(...fr,1);
  const pd={};A.forEach(a=>{const d=ds(a.ts);pd[d]=(pd[d]||0)+1});const pm=Math.max(...Object.values(pd),1);
  const ins=A.filter(a=>a.i),im=ins.length?ins.reduce((s,a)=>s+a.i,0)/ins.length:0;
  h+=`<div class="rs"><div class="hd"><span class="e">${esc(i.e)}</span><b>${esc(i.n)}</b><span class="n">${n}</span></div>
   <div class="st"><div><small>Por día</small><span>${(n/ND).toLocaleString("es-ES",{maximumFractionDigits:n/ND<0.1?2:1})}</span></div><div><small>Por semana</small><span>${(n/ND*7).toLocaleString("es-ES",{maximumFractionDigits:1})}</span></div><div><small>Días</small><span>${dd} de ${ND}</span></div></div>
   <div class="fr">${["Madrugada","Mañana","Tarde","Noche"].map((t,k)=>`<div><i><b style="height:${fr[k]/fm*100}%"></b></i>${t}<em>${fr[k]}</em></div>`).join("")}</div>
   <div class="sp">${days.map(d=>`<i class="${pd[d]?"":"z"}" style="height:${pd[d]?pd[d]/pm*100:6}%"></i>`).join("")}</div>
   ${im?`<div class="ft" style="margin:8px 0 0;text-align:left">Intensidad media: ${INT[Math.round(im)]} (${ins.length} con intensidad)</div>`:""}</div>`});
 return h+`<div class="ft">Madrugada 0–6 h · Mañana 6–12 h · Tarde 12–18 h · Noche 18–24 h</div>`}

/* ---- Apuntes ---- */
let AT="",AF="",AQ="";
function apuntes(){return`<div class="aw"><textarea id="ax" placeholder="Escribe un pensamiento, una anécdota, una idea…"></textarea>
 <div class="ty" id="aty">${S.nt.map(t=>`<button data-at="${esc(t)}" class="${t===AT?"on":""}">${esc(t)}</button>`).join("")}</div>
 <button class="sv" data-a="asave">Guardar</button></div>
 <h2>Mis apuntes<button class="lk" data-a="atipos">Tipos</button></h2>
 <div class="ty" id="afl"><button data-af="" class="${AF===""?"on":""}">Todos</button>${S.nt.map(t=>`<button data-af="${esc(t)}" class="${t===AF?"on":""}">${esc(t)}</button>`).join("")}</div>
 <input class="srch" id="aq" placeholder="Buscar…" value="${esc(AQ)}"><div id="apl"></div>`}
const nrm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function drawAp(){const q=nrm(AQ),L=S.no.filter(a=>(!AF||a.ty===AF)&&(!q||nrm(a.tx).includes(q))).sort((a,b)=>b.ts-a.ts);
 const x=$("apl");if(!x)return;x.innerHTML=L.length?L.map(a=>{const d=new Date(a.ts);return`<div class="an" data-an="${a.id}"><div class="m">${a.ty?`<em>${esc(a.ty)}</em>`:""}<span>${fdl(ds(a.ts))}${d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():""} · ${hh(a.ts)}</span></div><p>${esc(a.tx)}</p></div>`}).join(""):`<div class="emp">${S.no.length?"Nada coincide.":"Aún no hay apuntes."}</div>`}
document.addEventListener("input",e=>{if(e.target.id==="aq"){AQ=e.target.value;drawAp()}});
function editAn(id){const a=S.no.find(x=>x.id===id);if(!a)return;let ty=a.ty||"";
 shb.innerHTML=`<h3>Apunte</h3><div class="g2"><div><label>Día</label><input type="date" id="n-d" value="${ds(a.ts)}"></div><div><label>Hora</label><input type="time" id="n-h" value="${hh(a.ts)}"></div></div>
  <label>Tipo (opcional)</label><div class="ty" id="n-t">${S.nt.map(t=>`<button data-t="${esc(t)}" class="${t===ty?"on":""}">${esc(t)}</button>`).join("")}</div>
  <label>Texto</label><textarea id="n-x" style="min-height:160px">${esc(a.tx)}</textarea>
  <div class="ac"><button class="del" data-x="del">Borrar</button><button data-x="no">Cancelar</button><button class="ok" data-x="ok">Guardar</button></div>`;
 sh.classList.add("on");
 shb.onclick=e=>{const tb=e.target.closest("#n-t button");if(tb){ty=ty===tb.dataset.t?"":tb.dataset.t;shb.querySelectorAll("#n-t button").forEach(b=>b.classList.toggle("on",b.dataset.t===ty));return}
  const x=e.target.closest("[data-x]");if(!x)return;if(x.dataset.x==="no")return close();
  if(x.dataset.x==="del"){if(!confirm("¿Borrar este apunte?"))return;S.no=S.no.filter(y=>y.id!==id);save();close();render();return}
  const tx=$("n-x").value.trim();if(!tx){alert("El apunte está vacío");return}
  const dv=$("n-d").value,hv=$("n-h").value;if(dv&&hv){const n=new Date(dv+"T"+hv+":00").getTime();if(!isNaN(n))a.ts=n}
  a.tx=tx;if(ty)a.ty=ty;else delete a.ty;save();close();render()}}
function editTipos(){const T=S.nt.slice();
 const draw=()=>{shb.innerHTML=`<h3>Tipos de apunte</h3>${T.map((t,k)=>`<div class="eb" data-k="${k}"><input value="${esc(t)}" data-f="n"><button data-y="up">↑</button><button data-y="rm">✕</button></div>`).join("")}
  <div class="ac"><button data-y="add">＋ Añadir tipo</button></div><div class="ac"><button data-y="no">Cancelar</button><button class="ok" data-y="ok">Guardar</button></div>
  <div class="ft" style="margin-top:12px">Si renombras un tipo, sus apuntes se cambian también. Si lo quitas, sus apuntes se quedan sin tipo.</div>`};
 const read=()=>shb.querySelectorAll(".eb").forEach(r=>{T[+r.dataset.k]=r.querySelector("input").value.trim()});
 const orig=S.nt.slice(),map={};orig.forEach((t,k)=>map[k]=t);let idx=orig.map((t,k)=>k);
 draw();sh.classList.add("on");
 shb.onclick=e=>{const y=e.target.closest("[data-y]");if(!y)return;const k=y.closest(".eb")?+y.closest(".eb").dataset.k:-1;read();const a=y.dataset.y;
  if(a==="no")return close();
  if(a==="up"&&k>0){[T[k-1],T[k]]=[T[k],T[k-1]];[idx[k-1],idx[k]]=[idx[k],idx[k-1]];draw()}
  else if(a==="rm"){T.splice(k,1);idx.splice(k,1);draw()}
  else if(a==="add"){T.push("");idx.push(-1);draw();const r=shb.querySelectorAll(".eb input");r[r.length-1].focus()}
  else if(a==="ok"){const ren={};idx.forEach((o,k)=>{if(o>=0)ren[map[o]]=T[k]});
   S.no.forEach(n=>{if(!n.ty)return;if(n.ty in ren&&ren[n.ty])n.ty=ren[n.ty];else delete n.ty});
   S.nt=[...new Set(T.filter(Boolean))];if(AT&&!S.nt.includes(AT))AT="";if(AF&&!S.nt.includes(AF))AF="";save();close();render()}}}

/* ---- Hojas ---- */
const sh=$("sh"),shb=$("shb");const close=()=>sh.classList.remove("on");
sh.addEventListener("click",e=>{if(e.target===sh)close()});
function editAp(id){const a=S.ap.find(x=>x.id===id);if(!a)return;const i=apInfo(a),b=bOf(a.b),d=new Date(a.ts);
 let iv=a.i||0;
 shb.innerHTML=`<h3><span>${esc(i.e)}</span>${esc(i.n)}</h3>
  <div class="g2"><div><label>Día</label><input type="date" id="e-d" value="${ds(a.ts)}"></div><div><label>Hora</label><input type="time" id="e-h" value="${hh(a.ts)}"></div></div>
  ${a.b!=="nota"?`<label>Intensidad (opcional)</label><div class="op" id="e-i">${INT.map((t,k)=>`<button data-i="${k}" class="${k===iv?"on":""}">${t||"—"}</button>`).join("")}</div>`:""}
  ${(b&&b.t)||a.tc?`<label>Temperatura °C (opcional)</label><input id="e-t" inputmode="decimal" placeholder="38,2" value="${a.tc?String(a.tc).replace(".",","):""}">`:""}
  <label>Nota (opcional)</label><textarea id="e-n">${esc(a.no||"")}</textarea>
  <div class="ac"><button class="del" data-x="del">Borrar</button><button data-x="no">Cancelar</button><button class="ok" data-x="ok">Guardar</button></div>`;
 sh.classList.add("on");
 shb.onclick=e=>{const ib=e.target.closest("#e-i button");if(ib){iv=+ib.dataset.i;shb.querySelectorAll("#e-i button").forEach(x=>x.classList.toggle("on",x===ib));return}
  const x=e.target.closest("[data-x]");if(!x)return;
  if(x.dataset.x==="no")return close();
  if(x.dataset.x==="del"){if(!confirm("¿Borrar este apunte?"))return;S.ap=S.ap.filter(y=>y.id!==id);save();close();render();return}
  const dv=$("e-d").value,hv=$("e-h").value;if(dv&&hv){const n=new Date(dv+"T"+hv+":00").getTime();if(!isNaN(n))a.ts=n}
  if(iv)a.i=iv;else delete a.i;
  const tv=$("e-t")?$("e-t").value.trim().replace(",","."):"";if(tv&&+tv>30&&+tv<45)a.tc=Math.round(+tv*10)/10;else delete a.tc;
  const nv=$("e-n").value.trim();if(nv)a.no=nv;else delete a.no;
  if(a.b==="nota"&&!nv){S.ap=S.ap.filter(y=>y.id!==id)}
  DAY=ds(a.ts);save();close();render()}}
function editBtns(){const B=S.btn.map(b=>({...b}));
 const draw=()=>{shb.innerHTML=`<h3>Botones</h3>${B.map((b,k)=>`<div class="eb" data-k="${k}"><input class="em" value="${esc(b.e)}" data-f="e"><input value="${esc(b.n)}" data-f="n" placeholder="Nombre"><button class="tp ${b.t?"on":""}" data-y="t" title="Pedir temperatura">°C</button><button data-y="up">↑</button><button data-y="rm">✕</button></div>`).join("")}
  <div class="ac"><button data-y="add">＋ Añadir botón</button></div>
  <div class="ac"><button data-y="no">Cancelar</button><button class="ok" data-y="ok">Guardar</button></div>
  <div class="ft" style="margin-top:12px">°C activado = permite apuntar temperatura. Borrar un botón no borra sus apuntes.</div>`};
 const read=()=>shb.querySelectorAll(".eb").forEach(r=>{const b=B[+r.dataset.k];b.e=r.querySelector('[data-f=e]').value.trim();b.n=r.querySelector('[data-f=n]').value.trim()});
 draw();sh.classList.add("on");
 shb.onclick=e=>{const y=e.target.closest("[data-y]");if(!y)return;const k=y.closest(".eb")?+y.closest(".eb").dataset.k:-1;read();
  const a=y.dataset.y;
  if(a==="no")return close();
  if(a==="t"){B[k].t=B[k].t?0:1;draw()}
  else if(a==="up"&&k>0){[B[k-1],B[k]]=[B[k],B[k-1]];draw()}
  else if(a==="rm"){if(confirm("¿Quitar el botón «"+(B[k].n||"")+"»?")){B.splice(k,1);draw()}}
  else if(a==="add"){B.push({id:uid(),e:"⭐",n:"",t:0});draw();const r=shb.querySelectorAll(".eb");r[r.length-1].querySelector('[data-f=n]').focus()}
  else if(a==="ok"){S.btn=B.filter(b=>b.n).map(b=>({id:b.id,e:b.e||"⭐",n:b.n,t:b.t?1:0}));save();close();render()}}}

/* ---- Toast ---- */
let tid=null,last=null;
function toast(t,id){$("tt").textContent=t;last=id;$("tb").style.display=id?"":"none";$("toast").classList.add("on");clearTimeout(tid);tid=setTimeout(()=>$("toast").classList.remove("on"),3500)}
$("tb").onclick=()=>{$("toast").classList.remove("on");if(last)editAp(last)};

/* ---- Toques ---- */
document.addEventListener("click",e=>{if(e.target.closest("#sh")||e.target.closest("#toast"))return;
 const s=e.target.closest(".seg button");if(s){V=s.dataset.v;try{localStorage.setItem("sobremi-v",V)}catch(x){}render();return}
 const bb=e.target.closest("[data-b]");if(bb){const b=bOf(bb.dataset.b);if(!b)return;const a={id:uid(),b:b.id,e:b.e,n:b.n,ts:Date.now()};S.ap.push(a);DAY=today();save();render();
  if(navigator.vibrate)navigator.vibrate(15);toast(b.e+" "+b.n+" · "+hh(a.ts),a.id);return}
 const it=e.target.closest(".it");if(it){editAp(it.dataset.id);return}
 const an=e.target.closest("[data-an]");if(an){editAn(an.dataset.an);return}
 const at=e.target.closest("[data-at]");if(at){AT=AT===at.dataset.at?"":at.dataset.at;document.querySelectorAll("#aty button").forEach(b=>b.classList.toggle("on",b.dataset.at===AT));return}
 const af=e.target.closest("[data-af]");if(af){AF=af.dataset.af;document.querySelectorAll("#afl button").forEach(b=>b.classList.toggle("on",b.dataset.af===AF));drawAp();return}
 const r=e.target.closest("[data-rg]");if(r){RG=+r.dataset.rg;try{localStorage.setItem("sobremi-rg",RG)}catch(x){}render();return}
 const a=e.target.closest("[data-a]");if(!a)return;
 if(a.dataset.a==="tgl"){OPN=OPN?0:1;render();return}
 if(a.dataset.a==="hoy"){DAY=today();render();return}
 if(a.dataset.a==="cal"){const ds2=new Set(S.ap.map(x=>ds(x.ts)));openCal(DAY,today(),d=>ds2.has(d),d=>{DAY=d;render()});return}
 if(a.dataset.a==="pv"){DAY=addD(DAY,-1);render()}
 else if(a.dataset.a==="nx"&&DAY<today()){DAY=addD(DAY,1);render()}
 else if(a.dataset.a==="addb")editBtns();
 else if(a.dataset.a==="res"){V="res";render();scrollTo(0,0)}
 else if(a.dataset.a==="back"){V="hoy";render()}
 else if(a.dataset.a==="atipos")editTipos();
 else if(a.dataset.a==="asave"){const tx=$("ax").value.trim();if(!tx)return;const n={id:uid(),ts:Date.now(),tx};if(AT)n.ty=AT;S.no.push(n);AT="";save();render();toast("Apunte guardado · "+hh(n.ts))}
 else if(a.dataset.a==="nota"){const v=$("nota").value.trim();if(!v)return;const n={id:uid(),b:"nota",e:"📝",ts:Date.now(),no:v};S.ap.push(n);DAY=today();save();render();toast("📝 Nota guardada · "+hh(n.ts),n.id)}});
/* ---- Calendario ---- */
const CALM=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
function openCal(cur,max,has,pick){let ym=cur.slice(0,7);const ov=document.createElement("div");ov.className="calov";document.body.appendChild(ov);
 const draw=()=>{const [Y,M]=ym.split("-").map(Number),first=new Date(Y,M-1,1),off=(first.getDay()+6)%7,nd=new Date(Y,M,0).getDate(),mx=max.slice(0,7);
  let g="";for(let i=0;i<off;i++)g+="<i></i>";
  for(let d=1;d<=nd;d++){const k=ym+"-"+String(d).padStart(2,"0"),dis=k>max;g+=`<button data-cd="${k}" class="${k===cur?"on":""} ${k===max?"td":""}" ${dis?"disabled":""}>${d}${has(k)?"<em></em>":""}</button>`}
  ov.innerHTML=`<div class="calbx"><div class="calh"><button data-cm="-1">‹</button><b>${CALM[M-1]} ${Y}</b><button data-cm="1" ${ym>=mx?"disabled":""}>›</button></div><div class="calw"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="calg">${g}</div><button class="calt" data-cd="${max}">Ir a hoy</button></div>`};
 draw();
 ov.onclick=e=>{if(e.target===ov){ov.remove();return}const m=e.target.closest("[data-cm]");if(m){const [Y,M]=ym.split("-").map(Number),x=new Date(Y,M-1+ +m.dataset.cm,1);ym=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0");draw();return}
  const c=e.target.closest("[data-cd]");if(c&&!c.disabled){ov.remove();pick(c.dataset.cd)}}}
render();sync();
</script></body></html>
