<div class="cd" style="display:flex;gap:8px;align-items:end"><label style="flex:1" class="mut">Peso corporal (kg)<input id="bw" type="number" step="0.1" inputmode="decimal"></label><button class="s" onclick="sbw()">Guardar</button></div>
<p class="mut" style="margin:0 4px">Se aplica a los entrenos desde hoy; los anteriores conservan su peso.</p>
<div class="tabs" id="tb"></div><div id="v"></div>
<script>
const SB="https://tdundqjsixqrddszumly.supabase.co",SBK="sb_publishable_KTvtNJcl64iOH4Hee-3L-Q__vSiCgrP";
async function tok(){let s=null;try{s=JSON.parse(localStorage.getItem("gym-session"))}catch(e){}if(!s)return null;if(s.expires_at-60>Date.now()/1000)return s.access_token;
 try{const r=await fetch(SB+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SBK,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})});const j=await r.json();if(!r.ok)return null;const n=JSON.stringify({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(+j.expires_in||3600)});["gym-session","entreno-session"].forEach(k=>localStorage.setItem(k,n));return j.access_token}catch(e){return null}}
function Nube(row,key,emp,onNew,onSt){
 const UK=key+"-at",DK=key+"-dirty";let busy=0,again=0,tm=null;
 const lv=()=>{try{return JSON.parse(localStorage.getItem(key))||emp()}catch(e){return emp()}},lat=()=>+localStorage.getItem(UK)||0,em=v=>Array.isArray(v)?!v.length:!Object.keys(v).length;
 const hd=async j=>{const t=await tok();if(!t)throw new Error("nologin");const h={apikey:SBK,Authorization:"Bearer "+t};if(j){h["Content-Type"]="application/json";h.Prefer="resolution=merge-duplicates,return=minimal"}return h};
 async function put(){const at=lat();const r=await fetch(SB+"/rest/v1/vista_semanal",{method:"POST",headers:await hd(1),body:JSON.stringify({id:row,datos:{v:lv(),updatedAt:at},actualizado_en:new Date().toISOString()})});if(!r.ok)throw new Error("sb "+r.status);if(lat()===at)localStorage.setItem(DK,"0")}
 async function sync(){if(busy){again=1;return}busy=1;let st="ok";
  try{const r=await fetch(SB+"/rest/v1/vista_semanal?id=eq."+row+"&select=datos",{headers:await hd(0)});if(!r.ok)throw new Error("sb "+r.status);
   const rows=await r.json(),rem=rows.length?rows[0].datos:null,ra=+(rem&&rem.updatedAt)||0;let la=lat();const dirty=localStorage.getItem(DK)==="1";
   if(!rem||rem.v==null){if(!em(lv())){if(!la){la=Date.now();localStorage.setItem(UK,String(la))}await put()}}
   else if(dirty||la>ra)await put();
   else if(ra>la){localStorage.setItem(key,JSON.stringify(rem.v));localStorage.setItem(UK,String(ra));localStorage.setItem(DK,"0");onNew&&onNew()}}
  catch(e){st=e.message==="nologin"?"none":"off"}
  busy=0;onSt&&onSt(st==="ok"&&localStorage.getItem(DK)==="1"?"pending":st);if(again){again=0;setTimeout(sync,300)}}
 function changed(){localStorage.setItem(UK,String(Date.now()));localStorage.setItem(DK,"1");onSt&&onSt("pending");clearTimeout(tm);tm=setTimeout(sync,900)}
 return{sync,changed,lv}}
const J=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},$=s=>document.querySelector(s);
const G=J("gym-v3")||{},E=J("entreno-v2")||{},BW=(J("peso-corporal")||[]).sort((a,b)=>a.d<b.d?-1:1);
const N=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const C={Torso:"#4263EB",Brazos:"#E8590C",Pierna:"#2F9E44","Full body":"#7048E8",Cardio:"#E03131",Otro:"#868E96"};
const p2=n=>String(n).padStart(2,"0"),esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const dayOf=t=>{const d=new Date(t);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())};
const hm=t=>{const d=new Date(t);return p2(d.getHours())+":"+p2(d.getMinutes())};
const fd=d=>d.split("-").reverse().join("/"),nf=(v,n=0)=>v.toLocaleString("es-ES",{maximumFractionDigits:n}),fv=v=>nf(Math.round(v))+" kg";
const fdur=ms=>{const s=Math.round(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+" h "+p2(m)+" min":m+" min "+p2(s%60)+" s"};
const kgOf=v=>String(v==null?"":v).split("+").reduce((a,p)=>a+(parseFloat(p.replace(",","."))||0),0);
const num=v=>parseFloat(String(v==null?"":v).replace(",","."))||0;
const bw=d=>{let k=90;BW.forEach(e=>{if(e.d<=d)k=+e.kg||k});return k};
const MU={hombro:"Hombro",hombros:"Hombro",biceps:"Bíceps",triceps:"Tríceps",pecho:"Pecho",espalda:"Espalda",lumbar:"Espalda",antebrazo:"Antebrazo",pierna:"Pierna",abdominal:"Abdominal"};
const VG=m=>m==="Bíceps"||m==="Tríceps"?"Brazo":m;
const CG={Pecho:"Torso",Espalda:"Torso",Bíceps:"Brazos",Tríceps:"Brazos",Hombro:"Brazos",Antebrazo:"Brazos",Pierna:"Pierna"};
const D2=["press inclinado","press declinado","high row","curl mancuernas","curl martillo","curl predicador","elevacion lateral"];
const gx2=n=>{n=N(n);return D2.some(k=>n.includes(k))||/^hombros?\s*-\s*press$/.test(n)};
const fx2=(n,g)=>["curl","martillo","superior","press frances","elevacion delantera","elevacion lateral"].includes(N(n))||N(g)==="antebrazo";
function vol(n,kg,rep,sets,t,x2,d){const m=N(n);
 if(m.includes("pared"))return{v:63*(t/6)*sets,r:0};
 if(m.includes("flexion"))return{v:bw(d)*.65*rep*sets,r:0};
 const k=m.includes("sentadilla")?90:kg*(x2?2:1);
 return k>0?{v:k*rep*sets,r:0}:{v:0,r:rep*sets}}
const days={},DY=d=>days[d]||(days[d]={w:[],c:[],s:null});
function fin(w,d){w.d=d;w.v=0;w.r=0;w.vm={};w.ex.forEach(e=>{w.v+=e.v;w.r+=e.r;const g=VG(e.m);w.vm[g]=(w.vm[g]||0)+e.v});
 const gs=[...new Set(w.ex.map(e=>CG[e.m]).filter(Boolean))];w.gr=w.fb?["Full body"]:gs.length?gs:["Otro"];DY(d).w.push(w)}
const TX={};((G.tpl||[]).flatMap(t=>t.ex||[])).forEach(e=>{const k=N(e.name),o=TX[k]||(TX[k]={});if(e.mu&&!o.mu)o.mu=e.mu;if(e.x2!=null&&o.x2==null)o.x2=!!e.x2});
const TXE={};((E.routines||[]).flatMap(r=>r.ex||[])).forEach(e=>{if(e.x2!=null)TXE[N(e.name)]=!!e.x2});
const MV=["Pecho","Espalda","Hombro","Bíceps","Tríceps","Antebrazo","Pierna","Abdominal"];
const gm=(l)=>{const t=TX[N(l.name)]||{},mu=t.mu||l.mu;if(mu&&MV.includes(mu))return mu;const i=l.name.indexOf("-"),m=MU[N(i>0?l.name.slice(0,i):"")];return m||(N(l.tname)==="pierna"?"Pierna":"Otro")};
const gx=(l)=>{const t=TX[N(l.name)]||{};return t.x2!=null?t.x2:l.x2!=null?!!l.x2:gx2(l.name)};
function gex(l,d){let v=0,r=0;const sets=(l.sets||[]).map(s=>{const kg=kgOf(s.kg),rep=num(s.reps);if(!s.w){const o=vol(l.name,kg,rep,1,rep,gx(l),d);v+=o.v;r+=o.r}return{t:(s.w?"Calentamiento: ":"")+(s.kg?s.kg+" × ":"")+rep}});return{n:l.name,m:gm(l),sets,v,r}}
const WO=G.wo||[],LG=G.logs||[];
WO.filter(w=>w.type==="w").forEach(w=>{const L=LG.filter(l=>l.wid===w.id);if(!L.length)return;
 fin({id:w.id,nm:w.tname,start:w.start,end:w.end,dur:w.dur||(w.end-w.start),cal:w.cal,ex:L.map(l=>gex(l,w.day))},w.day)});
const lg={};LG.filter(l=>l.wid==="legacy").forEach(l=>(lg[l.day+"|"+l.tname]=lg[l.day+"|"+l.tname]||[]).push(l));
Object.keys(lg).forEach(k=>{const d=k.split("|")[0];fin({id:k,nm:lg[k][0].tname,cal:null,ex:lg[k].map(l=>gex(l,d))},d)});
(E.hist||[]).forEach(h=>fin({id:h.id,fb:1,nm:"Full body",start:h.ini,end:h.fin,dur:h.dur*1000,cal:h.kcal,ex:(h.ex||[]).map(e=>{const o=vol(e.n,+e.kg||0,+e.rep||0,e.h,+e.t||0,(TXE[N(e.n)]!=null?TXE[N(e.n)]:e.x2!=null?!!e.x2:fx2(e.n,e.g)),h.f);
 return{n:e.n,m:(e.mu&&MV.includes(e.mu)?e.mu:MU[N(e.g)]||"Otro"),sets:[{t:(e.t?e.t+" s":(e.kg?e.kg+" kg × ":"")+(e.rep||0))+" · "+e.h+"/"+e.s+" series"}],v:o.v,r:o.r}})},h.f));
WO.filter(w=>w.type==="c").forEach(c=>DY(c.day).c.push(c));
(G.steps||[]).forEach(z=>DY(z.d).s=z);
const pace=(d,s)=>{const m=s/60/d;return Math.floor(m)+":"+p2(Math.round((m%1)*60)%60)+" min/km"},kmh=(d,s)=>nf(d/(s/3600),1)+" km/h";

const MS=["Brazo","Antebrazo","Hombro","Pecho","Espalda","Pierna","Abdominal","Otro"],today=dayOf(Date.now());
const ALL=[];Object.keys(days).forEach(d=>days[d].w.forEach(w=>ALL.push(w)));ALL.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(b.start||0)-(a.start||0));
$("#bw").value=bw(today);
const PW=Nube("peso","peso-corporal",()=>[],()=>location.reload());PW.sync();
async function sbw(){const v=num($("#bw").value);if(!(v>0))return;const a=(J("peso-corporal")||[]).filter(e=>e.d!==today);a.push({d:today,kg:v});localStorage.setItem("peso-corporal",JSON.stringify(a));PW.changed();await Promise.race([PW.sync(),new Promise(r=>setTimeout(r,2500))]);location.reload()}
const sum=(L,f)=>{const o={},r={};L.forEach(w=>{for(const k in w.vm)o[k]=(o[k]||0)+w.vm[k];w.ex.forEach(e=>{if(e.r){const g=VG(e.m);r[g]=(r[g]||0)+e.r}})});return{v:o,r}};
const bars=(o,c="#4263EB")=>{const ks=MS.filter(k=>o[k]),mx=Math.max(...ks.map(k=>o[k]),1);return ks.map(k=>`<div class="br"><span>${k}</span><i style="width:${o[k]/mx*100}%;background:${c}"></i><span>${fv(o[k])}</span></div>`).join("")||'<p class="mut">Sin volumen con peso.</p>'};
const rp=r=>Object.keys(r).length?`<p class="mut">Sin peso: ${MS.filter(k=>r[k]).map(k=>k+" "+nf(r[k])+" reps").join(" · ")}</p>`:"";
const tot=L=>L.reduce((a,w)=>a+w.v,0);
function mon(d){const t=new Date(d+"T00:00");t.setDate(t.getDate()-(t.getDay()+6)%7);return dayOf(t)}
const VW={
dia(){const ds=[...new Set(ALL.map(w=>w.d))],t=ds.map(d=>tot(ALL.filter(w=>w.d===d))),mx=Math.max(...t,1);
 return ds.map((d,i)=>{const L=ALL.filter(w=>w.d===d),s=sum(L);return `<details class="cd"><summary><div class="br" style="grid-template-columns:84px 1fr auto"><span>${fd(d)}</span><i style="width:${t[i]/mx*100}%"></i><span>${fv(t[i])}</span></div></summary>${bars(s.v)}${rp(s.r)}</details>`}).join("")||'<p class="mut">Aún no hay entrenos.</p>'},
musculo(){const s=sum(ALL);return `<div class="cd"><b>Total por músculo</b>${bars(s.v,"#2F9E44")}${rp(s.r)}</div>`+
 MS.filter(k=>s.v[k]).map(k=>{const L=ALL.filter(w=>w.vm[k]).slice(0,8);return `<div class="cd"><b>${k}</b> <span class="mut">últimos entrenos</span>${L.map(w=>`<div class="row"><span>${fd(w.d)}</span><span>${fv(w.vm[k])}</span></div>`).join("")}</div>`}).join("")},
ejercicio(){const m={};ALL.forEach(w=>w.ex.forEach(e=>{const k=N(e.n),o=m[k]||(m[k]={n:e.n,d:{}});o.d[w.d]=(o.d[w.d]||0)+e.v}));
 const ks=Object.keys(m).sort((a,b)=>m[a].n.localeCompare(m[b].n));if(!ks.length)return '<p class="mut">Aún no hay ejercicios.</p>';
 window.SEL=window.SEL&&m[window.SEL]?window.SEL:ks[0];const o=m[window.SEL],ds=Object.keys(o.d).sort(),vs=ds.map(d=>o.d[d]),mx=Math.max(...vs,1),mn=Math.min(...vs);
 const pt=ds.map((d,i)=>[ds.length>1?10+i/(ds.length-1)*280:150,125-(mx>mn?(vs[i]-mn)/(mx-mn):.5)*100]);
 return `<select onchange="SEL=this.value;draw()">${ks.map(k=>`<option value="${k}" ${k===SEL?"selected":""}>${esc(m[k].n)}</option>`).join("")}</select>
 <div class="cd"><svg viewBox="0 0 300 140" width="100%"><polyline fill="none" stroke="#4263EB" stroke-width="2.5" points="${pt.map(p=>p.join(",")).join(" ")}"/>${pt.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#4263EB"/>`).join("")}<text x="4" y="12" font-size="10" fill="#666">${fv(mx)}</text><text x="4" y="138" font-size="10" fill="#666">${fv(mn)}</text></svg>
 <div class="mut">${fd(ds[0])} → ${fd(ds[ds.length-1])}</div></div><div class="cd">${[...ds].reverse().map(d=>`<div class="row"><span>${fd(d)}</span><span>${o.d[d]?fv(o.d[d]):"sin peso"}</span></div>`).join("")}</div>`},
entreno(){return ALL.map(w=>`<div class="cd"><div class="row"><b>${fd(w.d)} · ${w.gr.join(" + ")}</b><b>${fv(w.v)}</b></div>${Object.keys(w.vm).filter(k=>w.vm[k]).map(k=>`<span class="ch">${k} ${fv(w.vm[k])}</span>`).join("")}</div>`).join("")||'<p class="mut">Aún no hay entrenos.</p>'},
periodo(){const sem=window.PM!=="m",g={};ALL.forEach(w=>{const k=sem?mon(w.d):w.d.slice(0,7);(g[k]=g[k]||[]).push(w)});const ks=Object.keys(g).sort().reverse(),mx=Math.max(...ks.map(k=>tot(g[k])),1);
 return `<div style="display:flex;gap:6px"><button class="s" style="flex:1;${sem?"":"background:#868E96"}" onclick="PM='s';draw()">Semana</button><button class="s" style="flex:1;${sem?"background:#868E96":""}" onclick="PM='m';draw()">Mes</button></div>`+
 ks.map(k=>{const s=sum(g[k]),t=tot(g[k]);return `<details class="cd"><summary><div class="br"><span>${sem?"Sem. "+fd(k).slice(0,5):k.split("-").reverse().join("/")}</span><i style="width:${t/mx*100}%"></i><span>${fv(t)}</span></div></summary>${bars(s.v)}${rp(s.r)}</details>`}).join("")}};
const TB=[["dia","Día"],["musculo","Músculo"],["ejercicio","Ejercicio"],["entreno","Entreno"],["periodo","Semana / Mes"]];let cur="dia";
function draw(){$("#tb").innerHTML=TB.map(t=>`<button class="${t[0]===cur?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("");$("#v").innerHTML=VW[cur]()}
$("#tb").addEventListener("click",e=>{const b=e.target.closest("button");if(b){cur=b.dataset.t;draw()}});draw();
</script></body></html>
