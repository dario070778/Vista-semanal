<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entreno">
<meta name="theme-color" content="#EEF1F4">
<link rel="apple-touch-icon" href="icono-entreno.png">
<title>Entreno</title>
<style>
:root{--bg:#EEF1F4;--card:#fff;--ink:#14181F;--mut:#6B7480;--line:#DDE2E8;--acc:#2D5BFF;--ok:#1F9D6B;--bad:#D6453D}
@media(prefers-color-scheme:dark){:root{--bg:#0F1318;--card:#1A2028;--ink:#EEF1F4;--mut:#8A94A1;--line:#2A323C;--acc:#6E8BFF;--ok:#3CC892;--bad:#FF6B63}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.3 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 48px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 8px;border-bottom:1px solid var(--line)}
#tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);font-weight:600;color:var(--mut)}
.tab.on{background:var(--ink);color:var(--bg)}
.tab.plus{padding:8px 13px}
#now{display:grid;gap:8px}
.card{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 10px 10px 12px;border:2px solid var(--acc)}
.card.fin{border-color:var(--ok)}
.ci{flex:1;min-width:0}
.ci b{display:block;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci span{color:var(--mut);font-size:14px}
.sets{display:flex;gap:8px}
.set{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);font-size:18px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.set.on{background:var(--ok);border-color:var(--ok);color:#fff}
.x{width:28px;height:28px;color:var(--mut);font-size:18px}
.hint{margin:6px 2px;color:var(--mut);font-size:14px}
main{padding:0 14px}
h2{font-size:15px;font-weight:700;color:var(--mut);margin:20px 2px 8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px}
.row.fin{opacity:.55}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.ed{width:36px;height:36px;color:var(--mut);font-size:17px}
.add{width:100%;margin-top:14px;padding:14px;border-radius:14px;border:2px dashed var(--line);color:var(--mut);font-weight:600}
#sh{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.45);align-items:flex-end}
#sh.on{display:flex}
.sheet{width:100%;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);display:grid;gap:10px}
.sheet h3{margin:0 0 2px;font-size:20px}
.sheet label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.sheet input{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big{padding:14px;border-radius:14px;background:var(--bg);font-weight:600}
.big.pri{background:var(--acc);color:#fff}
.big.warn{color:var(--bad)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
.card{display:block;border:2px solid var(--c);border-left-width:8px;padding:8px 10px 10px 12px;background:color-mix(in srgb,var(--c) 9%,var(--card))}
.card.fin{background:color-mix(in srgb,var(--c) 24%,var(--card))}
.h{display:flex;align-items:center;gap:8px;min-width:0}
.h b{flex:1;min-width:0;font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g{flex:none;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);padding:3px 9px;border-radius:99px}
.b{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.m{display:flex;gap:6px;flex-wrap:wrap}
.m em{font-style:normal;font-weight:800;font-size:20px;background:color-mix(in srgb,var(--c) 14%,var(--card));border-radius:10px;padding:3px 9px;font-variant-numeric:tabular-nums}
.m small{font-size:12px;font-weight:600;color:var(--mut)}
.set{border-color:var(--c);color:var(--c)}
.set.on{background:var(--c);border-color:var(--c);color:#fff}
.row{border-left:8px solid var(--c)}
.row .ci{display:grid;gap:4px;justify-items:start}
.row .ci b{max-width:100%}
.row .m em{font-size:15px;padding:2px 8px}
.dots i{border-color:var(--c)}.dots i.on{background:var(--c)}
.sheet select{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
.lgc{width:100%;max-width:340px;background:var(--card);border-radius:18px;padding:20px;display:grid;gap:10px;box-shadow:0 6px 24px #0003}
.lgc h3{margin:0;font-size:22px;text-align:center}.lgc p{margin:0;color:var(--mut);font-size:14px;text-align:center}
.lgc input{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
</style></head>
<body>
<div class="top"><div id="tabs"></div><div id="now"></div></div>
<main id="list"></main>
<div id="sh"></div><div id="toast"></div>
<script>
const K="entreno-v2",$=s=>document.querySelector(s);
let S,ED=null;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GR={"Bíceps":"#E8590C","Tríceps":"#C2255C","Hombro":"#7048E8","Antebrazo":"#1C7ED6","Pierna":"#2F9E44","Lumbar":"#0C8599","Abdominal":"#E67700","Pecho":"#E03131","Espalda":"#4263EB","Otro":"#6B7480"};
const col=e=>GR[e.g]||GR.Otro;
const mk=(g,n,kg,rp,st)=>({id:uid(),g,name:n,kg,reps:rp,sets:st,done:Array(st).fill(false),pin:false});
const full=e=>e.done.every(Boolean);
function defS(){const S={cur:null,routines:[{id:uid(),name:"Full body",ex:[
  mk("Bíceps","Curl",10,12,2),mk("Bíceps","Martillo",10,12,2),mk("Tríceps","Superior",10,12,2),mk("Tríceps","Press francés",10,12,2),
  mk("Hombro","Elevación delantera",10,10,2),mk("Hombro","Elevación lateral",10,10,2),
  mk("Antebrazo","Delantero",10,12,3),mk("Antebrazo","Posterior",10,12,3),mk("Antebrazo","Giro",10,12,3),
  mk("Pierna","Sentadillas",0,15,3),mk("Pierna","Gemelos",0,15,3),mk("Pierna","Sentadilla pared",0,0,2),
  mk("Lumbar","Nadador",0,16,3),mk("Lumbar","Perro",0,16,3),mk("Lumbar","Boom",0,12,3),
  mk("Abdominal","Crunch",0,12,3),mk("Abdominal","Tijeras",0,16,3),mk("Abdominal","Bicicleta",0,16,3),
  mk("Pecho","Flexiones",0,0,2)]}]};S.cur=S.routines[0].id;return S}
const sig=X=>JSON.stringify(X.routines.map(r=>[r.name,r.ex.map(e=>[e.g,e.name,e.kg,e.reps,e.sets,e.done.some(Boolean)])]));
const isDef=()=>sig(S)===sig(defS());
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
 if(!S||!S.routines||!S.routines.length)S=defS()}
function save(){try{localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(UPD,String(Date.now()));localStorage.setItem(DRT,"1")}catch(e){}queueCloud()}
const R=()=>S.routines.find(r=>r.id===S.cur)||S.routines[0];
const chips=(e,ws)=>`<span class="m">${e.kg?`<em>${e.kg}<small> kg</small></em>`:""}${e.reps?`<em>${e.reps}<small> rep</small></em>`:""}${e.time?`<em>${e.time}<small> s</small></em>`:""}${ws||(!e.kg&&!e.reps&&!e.time)?`<em>${e.sets}<small> series</small></em>`:""}</span>`;
const card=e=>`<div class="card${full(e)?" fin":""}" style="--c:${col(e)}"><div class="h"><span class="g">${esc(e.g||"Otro")}</span><b>${esc(e.name)}</b><button class="x" data-a="unpin" data-id="${e.id}" aria-label="Quitar de en marcha">✕</button></div><div class="b">${chips(e,0)}<div class="sets">${e.done.map((d,i)=>`<button class="set${d?" on":""}" data-a="set" data-id="${e.id}" data-i="${i}" aria-label="Serie ${i+1}">${i+1}</button>`).join("")}</div></div></div>`;
const row=e=>`<div class="row${full(e)?" fin":""}" style="--c:${col(e)}" data-a="${full(e)?"redo":"pin"}" data-id="${e.id}"><div class="ci"><span class="g">${esc(e.g||"Otro")}</span><b>${esc(e.name)}</b>${chips(e,1)}</div><div class="dots">${e.done.map(d=>`<i class="${d?"on":""}"></i>`).join("")}</div><button class="ed" data-a="edit" data-id="${e.id}" aria-label="Editar">✎</button></div>`;
function render(){const r=R();S.cur=r.id;
 $("#tabs").innerHTML=S.routines.map(x=>`<button class="tab${x.id===r.id?" on":""}" data-a="tab" data-id="${x.id}">${esc(x.name)}</button>`).join("")+`<button class="tab plus" data-a="addr" aria-label="Nueva rutina">+</button><button class="tab plus" data-a="menu" aria-label="Opciones">⋯</button>`;
 const pin=r.ex.filter(e=>e.pin),pen=r.ex.filter(e=>!e.pin&&!full(e)),dn=r.ex.filter(e=>!e.pin&&full(e));
 $("#now").innerHTML=pin.length?pin.map(card).join(""):`<p class="hint">${r.ex.length?"Toca un ejercicio de la lista para ponerlo en marcha (hasta 3 a la vez).":"Rutina vacía. Añade tu primer ejercicio."}</p>`;
 $("#list").innerHTML=(pen.length?`<h2>Pendientes</h2>`+pen.map(row).join(""):"")+(dn.length?`<h2>Hechos · toca para repetir</h2>`+dn.map(row).join(""):"")+`<button class="add" data-a="new">Añadir ejercicio</button>`}
function openSh(h){$("#sh").innerHTML=`<div class="sheet">${h}</div>`;$("#sh").classList.add("on")}
function closeSh(){$("#sh").classList.remove("on");ED=null}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}
function sheetEx(e){ED=e;openSh(`<h3>${e?"Editar ejercicio":"Nuevo ejercicio"}</h3><label>Grupo<select id="f-g">${Object.keys(GR).map(k=>`<option${(e?e.g:"Otro")===k?" selected":""}>${k}</option>`).join("")}</select></label><label>Nombre<input id="f-n" value="${e?esc(e.name):""}" autocomplete="off"></label><div class="g3"><label>Peso (kg)<input id="f-k" type="number" inputmode="decimal" step="0.5" value="${e?e.kg:""}"></label><label>Repeticiones<input id="f-r" type="number" inputmode="numeric" value="${e?e.reps:""}"></label><label>Series<input id="f-s" type="number" inputmode="numeric" min="1" max="10" value="${e?e.sets:3}"></label></div><label>Tiempo (segundos, opcional)<input id="f-t" type="number" inputmode="numeric" value="${e&&e.time?e.time:""}"></label><button class="big pri" data-a="savex">Guardar</button>${e?`<button class="big warn" data-a="delx">Eliminar ejercicio</button>`:""}<button class="big" data-a="close">Cancelar</button>`)}
document.addEventListener("click",ev=>{
 const t=ev.target.closest("[data-a]");if(!t)return;
 if(ev.target.id==="sh"){closeSh();return}
 const a=t.dataset.a,r=R(),e=r.ex.find(x=>x.id===t.dataset.id);
 if(a==="tab")S.cur=t.dataset.id;
 else if(a==="addr"){const n=prompt("Nombre de la rutina");if(!n||!n.trim())return;const x={id:uid(),name:n.trim(),ex:[]};S.routines.push(x);S.cur=x.id}
 else if(a==="menu"){openSh(`<h3>${esc(r.name)}</h3>${gs()?`<button class="big" data-a="syncnow">Sincronizar ahora</button>`:`<button class="big" data-a="login">Iniciar sesión</button>`}<button class="big" data-a="reset">Reiniciar series</button><button class="big" data-a="ren">Renombrar rutina</button><button class="big warn" data-a="delr">Eliminar rutina</button><button class="big" data-a="close">Cerrar</button>`);return}
 else if(a==="login"){closeSh();showLogin();return}
 else if(a==="syncnow"){closeSh();sync().then(()=>toast("Sincronizado"));return}
 else if(a==="close"){closeSh();return}
 else if(a==="reset"){r.ex.forEach(x=>{x.done=x.done.map(()=>false);x.pin=false});closeSh()}
 else if(a==="ren"){const n=prompt("Nuevo nombre",r.name);closeSh();if(n&&n.trim())r.name=n.trim()}
 else if(a==="delr"){closeSh();if(!confirm("¿Eliminar la rutina «"+r.name+"»?"))return;S.routines=S.routines.filter(x=>x!==r);if(!S.routines.length)S.routines.push({id:uid(),name:"Rutina",ex:[]});S.cur=S.routines[0].id}
 else if(a==="set"&&e){const i=+t.dataset.i;e.done[i]=!e.done[i];if(full(e))setTimeout(()=>{if(full(e)){e.pin=false;save();render()}},700)}
 else if(a==="pin"&&e){if(r.ex.filter(x=>x.pin).length>=3){toast("Ya tienes 3 en marcha");return}e.pin=true}
 else if(a==="unpin"&&e)e.pin=false;
 else if(a==="redo"&&e)e.done=e.done.map(()=>false);
 else if(a==="edit"&&e){sheetEx(e);return}
 else if(a==="new"){sheetEx(null);return}
 else if(a==="savex"){const n=$("#f-n").value.trim();if(!n){toast("Pon un nombre");return}
  const g=$("#f-g").value,kg=+$("#f-k").value||0,rp=+$("#f-r").value||0,st=Math.max(1,Math.min(10,Math.round(+$("#f-s").value)||1)),tm=+$("#f-t").value||0;
  if(ED){ED.g=g;ED.name=n;ED.kg=kg;ED.reps=rp;ED.time=tm;if(st!==ED.sets){ED.done=Array.from({length:st},(_,i)=>!!ED.done[i]);ED.sets=st}}else r.ex.push(Object.assign(mk(g,n,kg,rp,st),{time:tm}));closeSh()}
 else if(a==="delx"&&ED){const x=ED;closeSh();if(!confirm("¿Eliminar «"+x.name+"»?"))return;r.ex=r.ex.filter(y=>y!==x)}
 save();render()});
const SB="https://tdundqjsixqrddszumly.supabase.co",SBK="sb_publishable_KTvtNJcl64iOH4Hee-3L-Q__vSiCgrP",ROW="entreno";
const SES="entreno-session",UPD="entreno-updated-at",DRT="entreno-dirty";
let cbusy=false,ctimer=null;
const gs=()=>{try{return JSON.parse(localStorage.getItem(SES))}catch(e){return null}};
const lupd=()=>+localStorage.getItem(UPD)||0,dirty=()=>localStorage.getItem(DRT)==="1";
async function areq(path,body){const r=await fetch(`${SB}/auth/v1/${path}`,{method:"POST",headers:{apikey:SBK,"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error_description||j.msg||j.message||("Error "+r.status));return j}
function ssave(j){const s={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(+j.expires_in||3600)};localStorage.setItem(SES,JSON.stringify(s));return s}
async function atoken(){let s=gs();if(!s)return null;if(s.expires_at-60>Date.now()/1000)return s.access_token;try{s=ssave(await areq("token?grant_type=refresh_token",{refresh_token:s.refresh_token}));return s.access_token}catch(e){if(/invalid|expired|not found|already used/i.test(e.message))localStorage.removeItem(SES);return null}}
async function hd(json){const t=await atoken();if(!t)throw new Error("nologin");const h={apikey:SBK,Authorization:"Bearer "+t};if(json){h["Content-Type"]="application/json";h.Prefer="return=minimal"}return h}
function dot(st){let d=$("#dot");if(!d){d=document.createElement("div");d.id="dot";d.style.cssText="position:fixed;top:calc(env(safe-area-inset-top,0px) + 4px);right:6px;width:9px;height:9px;border-radius:50%;z-index:6;pointer-events:none";document.body.appendChild(d)}d.style.background={ok:"#2e9e4f",pending:"#e0a100",off:"#d33",none:"#999"}[st]||"#999"}
function queueCloud(){if(!gs()){dot("none");return}dot("pending");clearTimeout(ctimer);ctimer=setTimeout(()=>{ctimer=null;sync()},1200)}
async function cput(sentAt){const r=await fetch(`${SB}/rest/v1/vista_semanal?id=eq.${ROW}`,{method:"PATCH",headers:await hd(true),body:JSON.stringify({datos:{state:S,updatedAt:lupd()},actualizado_en:new Date().toISOString()})});if(!r.ok)throw new Error("sb "+r.status);if(lupd()===sentAt)localStorage.setItem(DRT,"0")}
async function sync(){if(cbusy||ctimer)return;if(!gs()){dot("none");return}cbusy=true;
 try{const r=await fetch(`${SB}/rest/v1/vista_semanal?id=eq.${ROW}&select=datos`,{headers:await hd(false)});if(!r.ok)throw new Error("sb "+r.status);
  const rows=await r.json(),rem=rows.length?rows[0].datos:null,remAt=+(rem&&rem.updatedAt)||0;let locAt=lupd();
  if(!locAt&&!isDef()){locAt=Date.now();localStorage.setItem(UPD,String(locAt));localStorage.setItem(DRT,"1")}
  if(!rows.length||!rem||!rem.state){const h=await hd(true);h.Prefer="resolution=merge-duplicates,return=minimal";const p=await fetch(`${SB}/rest/v1/vista_semanal`,{method:"POST",headers:h,body:JSON.stringify({id:ROW,datos:{state:S,updatedAt:lupd()||Date.now()}})});if(!p.ok)throw new Error("sb "+p.status);localStorage.setItem(DRT,"0")}
  else if(dirty()||locAt>remAt){await cput(lupd())}
  else if(remAt>locAt){S=rem.state;if(!S.routines||!S.routines.length)S=defS();localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(UPD,String(remAt));localStorage.setItem(DRT,"0");if(!document.querySelector("#sh.on"))render()}
  dot(dirty()?"pending":"ok")}
 catch(e){dot(gs()?"off":"none");if(e.message==="nologin"&&!gs())showLogin()}
 finally{cbusy=false}}
function showLogin(){if($("#lg"))return;const d=document.createElement("div");d.id="lg";d.style.cssText="position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px";
 d.innerHTML='<div class="lgc"><h3>Entreno en casa</h3><p>Inicia sesión para guardar tus ejercicios en la nube.</p><input id="lg-e" type="email" autocomplete="username" placeholder="Correo"><input id="lg-p" type="password" autocomplete="current-password" placeholder="Contraseña"><button class="big pri" id="lg-b" type="button">Entrar</button><button class="big" id="lg-x" type="button">Ahora no</button><p id="lg-m" style="color:var(--bad);min-height:18px"></p></div>';
 document.body.appendChild(d);
 const go=async()=>{const m=$("#lg-m");m.textContent="Entrando…";try{ssave(await areq("token?grant_type=password",{email:$("#lg-e").value.trim(),password:$("#lg-p").value}));d.remove();dot("pending");await sync();toast("Sesión iniciada")}catch(e){m.textContent="No se pudo entrar: revisa el correo y la contraseña."}};
 $("#lg-b").onclick=go;$("#lg-x").onclick=()=>d.remove();$("#lg-p").addEventListener("keydown",e=>{if(e.key==="Enter")go()})}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync()});
load();render();
if(!gs())showLogin();else sync();
</script></body></html>
