<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Darío">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0B0B0C">
<link rel="apple-touch-icon" href="icono-dario.png?v=1">
<link rel="icon" href="icono-dario.png?v=1">
<title>Darío</title>
<style>
:root{--bg:#0B0B0C;--bar:#000;--ink:#F4F1EA;--mut:#77736C;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:600 16px -apple-system,system-ui,sans-serif}
#fr{position:fixed;left:0;right:0;top:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
#fr iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bar);border-top:1px solid #1E1E22;display:grid;grid-template-columns:repeat(5,1fr);z-index:5}
nav button{border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 11px -apple-system,system-ui,sans-serif;letter-spacing:.3px;cursor:pointer}
nav button svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink)}
#lg{position:fixed;inset:0;z-index:9;background:#fff;color:#111;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px}
#lg.on{display:flex}
#lg img{width:150px;height:150px;margin-bottom:6px}
#lg h1{margin:0 0 22px;font:800 30px -apple-system,system-ui,sans-serif;letter-spacing:.5px}
#lg input{width:100%;max-width:320px;font:500 17px -apple-system,system-ui,sans-serif;padding:13px 14px;border:1px solid #ccc;border-radius:12px;margin:5px 0;background:#fff;color:#111}
#lg button{width:100%;max-width:320px;font:700 17px -apple-system,system-ui,sans-serif;padding:14px;border:0;border-radius:12px;background:#111;color:#fff;margin-top:10px}
#lg p{min-height:20px;color:#b00;font-size:14px;margin:10px 0 0;text-align:center}
</style></head><body>
<div id="fr"></div>
<nav>
 <button data-t="dep"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Deporte</button>
 <button data-t="ocio"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/></svg>Ocio</button>
 <button data-t="sal"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/><path d="M7.5 12h2.5l1.2-2 1.8 4 1.2-2h2.3"/></svg>Salud</button>
 <button data-t="yo"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8.5 8V6a1.5 1.5 0 0 1 1.5-1.5h4A1.5 1.5 0 0 1 15.5 6v2M3 13h18M10.5 13v2h3v-2"/></svg>Útil</button>
 <button data-t="vida"><svg viewBox="0 0 24 24"><path d="M5 2.5h14M5 21.5h14" stroke-width="2.6"/><path d="M7 2.5v3.2c0 2.6 3.3 4.4 5 6.3c1.7-1.9 5-3.7 5-6.3V2.5M7 21.5v-3.2c0-2.6 3.3-4.4 5-6.3c1.7 1.9 5 3.7 5 6.3v3.2"/><path d="M9.2 6.2h5.6c-.4 1.3-1.6 2.3-2.8 3.4c-1.2-1.1-2.4-2.1-2.8-3.4zM7.8 21v-2.2c.6-1.5 2.4-2.6 4.2-2.9c1.8.3 3.6 1.4 4.2 2.9V21z" fill="currentColor" stroke="none"/></svg>Vida</button>
</nav>
<div id="lg"><img src="icono-dario.png?v=1" alt=""><h1>Darío</h1>
 <input id="lg-e" type="email" placeholder="Correo" autocomplete="username">
 <input id="lg-p" type="password" placeholder="Contraseña" autocomplete="current-password">
 <button id="lg-b">Entrar</button><p id="lg-m"></p></div>
<script>
const SB="https://tdundqjsixqrddszumly.supabase.co",SBK="sb_publishable_KTvtNJcl64iOH4Hee-3L-Q__vSiCgrP";
/* Una sola sesión para todas las apps */
const KS=["gym-session","entreno-session","pelis-session","series-session"];
const T={ocio:"ocio.html?v=3",dep:"app.html",sal:"salud.html?v=9",yo:"util.html?v=7",vida:"vida.html?v=20"};
const J=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};
function best(){let b=null;KS.forEach(k=>{const v=J(k);if(v&&v.refresh_token&&(!b||(v.expires_at||0)>(b.expires_at||0)))b=v});return b}
function sync(){try{const b=best();if(b){const j=JSON.stringify(b);KS.forEach(k=>localStorage.setItem(k,j))}return!!b}catch(e){return false}}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
const nav=document.querySelector("nav"),fr=document.getElementById("fr");let cur=null;
function go(id){cur=id;nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===id));
 sync();fr.innerHTML="";const f=document.createElement("iframe");f.src=T[id];fr.appendChild(f)}
nav.addEventListener("click",e=>{const b=e.target.closest("button");if(b&&b.dataset.t!==cur)go(b.dataset.t)});
/* Inicio de sesión (solo si no hay ninguna sesión guardada) */
const lg=document.getElementById("lg");
document.getElementById("lg-b").onclick=async()=>{const m=document.getElementById("lg-m");m.textContent="Entrando…";
 try{const r=await fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SBK,"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("lg-e").value.trim(),password:document.getElementById("lg-p").value})});
  const j=await r.json();if(!r.ok)throw 0;
  const s=JSON.stringify({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(+j.expires_in||3600)});
  KS.forEach(k=>localStorage.setItem(k,s));lg.classList.remove("on");m.textContent="";go("sal")}
 catch(e){m.textContent="No se pudo entrar: revisa el correo y la contraseña."}};
if(sync())go("sal");else lg.classList.add("on");
</script></body></html>
