<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#0B0B0C"><link rel="apple-touch-icon" href="icono-gym.png?v=2">
<title>Entrenamiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0C;--pill:#16161A;--ink:#F4F1EA;--on:#F2B632;--onink:#111;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:600 17px -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
nav{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;flex:none}
nav button{font:inherit;border:0;border-radius:999px;padding:12px 20px;background:var(--pill);color:var(--ink);white-space:nowrap}
nav button.on{background:var(--on);color:var(--onink)}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
nav button{font-family:'Barlow Condensed','Arial Narrow',-apple-system,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.4px;font-weight:700;font-size:17px;padding:10px 18px}nav button.on{font-weight:800}
#off{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:9;background:#3a1d1d;color:#ff8a80;font:700 13px -apple-system,system-ui,sans-serif;padding:8px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 10px #000a}#off.on{display:block}
</style></head><body>
<nav></nav><div id="off">Sin conexión · se guarda en el móvil y se sube al volver</div>
<script>
const T=[["gym","Entrenamiento","gym.html?v=22"],["pro","Progreso","progreso.html?v=21"],["cal","Calendario","calendario.html?v=21"],["vol","Volumen","volumen.html?v=21"],["gra","Gráficas","graficas.html?v=21"],["kc","Calorías","calorias.html?v=21"]];
const off=document.getElementById("off"),upd=()=>off.classList.toggle("on",!navigator.onLine);addEventListener("online",upd);addEventListener("offline",upd);upd();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
const nav=document.querySelector("nav");let cur="gym";
try{cur=localStorage.getItem("app-tab")||"gym"}catch(e){}if(!T.some(t=>t[0]===cur))cur="gym";
if(!T.some(t=>t[0]===cur))cur="gym";
const KS=["gym-session","entreno-session"];
function sync(){try{let b=null;KS.forEach(k=>{const v=JSON.parse(localStorage.getItem(k)||"null");if(v&&v.refresh_token&&(!b||(v.expires_at||0)>(b.expires_at||0)))b=v});if(b){const j=JSON.stringify(b);KS.forEach(k=>localStorage.setItem(k,j))}}catch(e){}}
function go(id){cur=id;try{localStorage.setItem("app-tab",id)}catch(e){}
 nav.innerHTML=T.map(t=>`<button class="${t[0]===id?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("");
 const old=document.querySelector("iframe");if(old)old.remove();
 sync();
 const f=document.createElement("iframe");f.src=T.find(t=>t[0]===id)[2];document.body.appendChild(f)}
nav.addEventListener("click",e=>{const b=e.target.closest("button");if(b&&b.dataset.t!==cur)go(b.dataset.t)});
go(cur);
</script></body></html>
