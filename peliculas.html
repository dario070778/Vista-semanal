<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Películas">
<meta name="theme-color" content="#EEF1F4">
<link rel="apple-touch-icon" href="icono-peliculas.png">
<link rel="icon" href="icono-peliculas.png">
<title>Películas</title>
<style>
:root{--bg:#EEF1F4;--card:#fff;--ink:#14181F;--mut:#6B7480;--line:#DDE2E8;--acc:#2D5BFF;--ok:#1F9D6B;--bad:#D6453D;--amb:#F08C00;--imdb:#F5C518}
@media(prefers-color-scheme:dark){:root{--bg:#0F1318;--card:#1A2028;--ink:#EEF1F4;--mut:#8A94A1;--line:#2A323C;--acc:#6E8BFF;--ok:#3CC892;--bad:#FF6B63;--amb:#FFB020}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.3 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 40px)}
button,select{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px}.hd h1{flex:1;margin:0;font-size:26px}
.lnkb{color:var(--acc);font-weight:600;font-size:16px;padding:6px 4px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px;background:var(--card);border-radius:14px;padding:4px}
.tabs button{padding:10px 4px;border-radius:11px;font-weight:700;font-size:15px;color:var(--mut)}
.tabs button.on{background:var(--acc);color:#fff}
.subs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.subs button{flex:none;padding:7px 12px;border-radius:99px;background:var(--card);font-weight:600;font-size:14px;color:var(--mut)}
.subs button.on{background:var(--ink);color:var(--bg)}
.tool{display:flex;gap:6px;margin-top:8px}
.tool input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 11px}
.tool select,.tool .fb{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 9px;font-size:14px;font-weight:600;color:var(--ink)}
.fb.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.prog{font-size:12px;color:var(--mut);margin-top:6px}
main{padding:4px 14px}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:11px 12px;margin:6px 0;cursor:pointer}
.row .t{flex:1;min-width:0}
.row b{display:block;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt{flex:none;font-weight:800;font-size:14px;padding:3px 7px;border-radius:7px;background:var(--imdb);color:#000;font-variant-numeric:tabular-nums}
.ic{flex:none;font-size:15px}
.more{display:block;width:100%;margin:10px 0;padding:12px;border-radius:12px;border:2px dashed var(--line);color:var(--mut);font-weight:600}
.add{display:block;width:100%;margin:10px 0 4px;padding:11px;border-radius:12px;background:var(--acc);color:#fff;font-weight:700}
.hint{color:var(--mut);font-size:14px;margin:14px 2px;text-align:center}
#sh{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.45);align-items:flex-end}
#sh.on{display:flex}
.sheet{width:100%;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);display:grid;gap:10px}
.sheet h3{margin:0;font-size:20px}.sheet h4{margin:6px 0 0;font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.sheet label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.sheet input,.lgc input{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.big{padding:13px;border-radius:14px;background:var(--bg);font-weight:600}
.big.p{background:var(--acc);color:#fff}.big.w{color:var(--bad)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chips button{padding:8px 12px;border-radius:99px;background:var(--bg);font-weight:600;font-size:14px}.chips button.on{background:var(--acc);color:#fff}
.fi{display:flex;gap:12px;align-items:flex-start}.fi img{width:110px;border-radius:10px;flex:none;background:var(--bg);min-height:160px}
.fi h3{font-size:21px}.fi p{margin:4px 0 0;color:var(--mut);font-size:14px}
.rt{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.rt div{background:var(--bg);border-radius:10px;padding:7px 8px;text-align:center}.rt b{display:block;font-size:18px}.rt span{font-size:11px;color:var(--mut)}
.ov{font-size:15px;line-height:1.4;margin:0}
.pp{display:inline-block;margin:0 6px 6px 0;padding:5px 10px;border-radius:99px;background:var(--bg);font-size:14px;font-weight:600}
.res{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--bg);text-align:left;width:100%}
.res img{width:40px;height:60px;object-fit:cover;border-radius:6px;background:var(--line);flex:none}
.res.on{outline:3px solid var(--acc)}
.np{width:40px;height:60px;border-radius:6px;background:var(--line);flex:none;display:block}
.res small{display:block;color:var(--mut);font-size:13px}
.warn{color:var(--amb);font-size:13px}
.pv{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.pv span{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:10px;padding:4px 8px 4px 4px;font-size:13px;font-weight:600}.pv img{width:28px;height:28px;border-radius:7px}
.pvl{font-size:12px;color:var(--mut);margin:2px 0 -2px}
.ok2{color:var(--ok);font-size:13px;font-weight:700}
.dt{display:grid;gap:4px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px}
.sec{font-size:13px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:16px 2px 4px}
.res .ok2{margin-left:auto}
.lgc{width:100%;max-width:340px;background:var(--card);border-radius:18px;padding:20px;display:grid;gap:10px;box-shadow:0 6px 24px #0003}
.lgc h3{margin:0;font-size:22px;text-align:center}.lgc p{margin:0;color:var(--mut);font-size:14px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;white-space:nowrap}
#toast.on{opacity:1}
</style></head>
<body>
<div class="top">
 <div class="hd"><h1>Películas</h1><button class="lnkb" data-a="menu">Datos</button></div>
 <div class="tabs"><button data-a="tab" data-k="s" id="tb-s">Sin ver</button><button data-a="tab" data-k="v" id="tb-v">Vistas</button><button data-a="tab" data-k="e" id="tb-e">Estrenos</button></div>
 <div class="subs" id="subs"></div>
 <div class="tool"><input id="q" type="search" placeholder="Buscar título…" autocomplete="off"><select id="ord"><option value="a">Últimas</option><option value="n">A-Z</option><option value="y">Año</option><option value="r">Nota</option></select><button class="fb" data-a="filt" id="fb">Filtros</button></div>
 <div class="prog" id="prog"></div>
</div>
<main><button class="add" data-a="addm" id="addb">+ Añadir película</button><div id="ls"></div></main>
<div id="sh"></div><div id="toast"></div>
<script>
const K="pelis-v1",MK="pelis-meta",KK="pelis-keys",UI="pelis-ui",OK_="pelis-omdb",$=s=>document.querySelector(s);
const IMG="https://image.tmdb.org/t/p/";
let PADD=null,S,M,KEYS=null,T="s",SUB="g",ORD="a",Q="",LIM=200,CUR=null,RES=[],RSEL=null,FX=null;
let F={src:"imdb",min:0,vot:0,g:"",y1:"",y2:"",dir:"",act:""};
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nrm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9ñ ]+/g," ").replace(/\s+/g," ").trim();
const f1=x=>x==null?"":(+x).toLocaleString("es-ES",{minimumFractionDigits:1,maximumFractionDigits:1});
const fn=x=>x==null?"":(+x).toLocaleString("es-ES");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!Array.isArray(S.movies))S={movies:[]};
 try{M=JSON.parse(localStorage.getItem(MK))}catch(e){}if(!M||typeof M!=="object")M={};
 try{KEYS=JSON.parse(localStorage.getItem(KK))}catch(e){}
 try{const u=JSON.parse(localStorage.getItem(UI));if(u){T=u.T||T;SUB=u.SUB||SUB;ORD=u.ORD||ORD;Object.assign(F,u.F||{})}}catch(e){}}
function saveUI(){try{localStorage.setItem(UI,JSON.stringify({T,SUB,ORD,F}))}catch(e){}}
function save(){try{localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(UPD,String(Date.now()));localStorage.setItem(DRT,"1")}catch(e){}queueCloud()}
let mdirty=false,mt=null;
function saveMeta(fast){try{localStorage.setItem(MK,JSON.stringify(M))}catch(e){}mdirty=true;clearTimeout(mt);mt=setTimeout(msync,fast?2000:30000)}
const meta=m=>M[m.id]||null;
const disp=m=>{const e=M[m.id];return m.cn||(e&&e.tm>0&&e.t)||m.n};
const where=m=>m.s==="e"?"Estrenos":(m.s==="v"?"Vistas":"Sin ver")+(m.dl?" · Descargar":"")+(m.s==="s"&&m.rec!=null&&!m.dl?" · Recomendadas":"");
const today=()=>new Date().toISOString().slice(0,10);
const fdate=d=>d?new Date(d+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"}):"";
const left=d=>{if(!d)return"";const n=Math.round((new Date(d+"T12:00:00")-new Date(today()+"T12:00:00"))/864e5);return n>1?`faltan ${n} días`:n===1?"mañana":n===0?"¡hoy!":"ya estrenada"};
const relOf=m=>{const e=meta(m);return e?(e.rc||e.rd||null):null};
/* Notas */
function rating(m,src){const e=meta(m);if(!e)return null;src=src||F.src;
 if(src==="imdb")return e.ir??null;if(src==="tmdb")return e.tv??null;if(src==="rt")return e.rt!=null?e.rt/10:null;if(src==="mc")return e.mc!=null?e.mc/10:null;
 const a=[e.ir,e.tv,e.rt!=null?e.rt/10:null,e.mc!=null?e.mc/10:null].filter(x=>x!=null);return a.length?Math.round(a.reduce((p,c)=>p+c,0)/a.length*10)/10:null}
function votes(m,src){const e=meta(m);if(!e)return 0;src=src||F.src;if(src==="imdb")return e.iv||0;if(src==="tmdb")return e.tc||0;return Math.max(e.iv||0,e.tc||0)}
const fActive=()=>F.min||F.vot||F.g||F.y1||F.y2||F.dir||F.act;
/* Listas */
function inSub(m){if(m.s!==T)return false;if(T==="e")return true;if(T==="s")return SUB==="r"?m.rec!=null:SUB==="d"?!!m.dl:!m.dl;return SUB==="f"?!!m.fav:SUB==="d"?!!m.dl:true}
function list(){const q=nrm(Q),fd=nrm(F.dir),fa=nrm(F.act);
 let a=S.movies.filter(m=>{if(!inSub(m))return false;const e=meta(m);
  if(q&&!(nrm(m.n).includes(q)||(m.cn&&nrm(m.cn).includes(q))||(e&&(nrm(e.t).includes(q)||nrm(e.ot).includes(q)))))return false;
  if(F.min){const r=rating(m);if(r==null||r<F.min)return false}
  if(F.vot&&votes(m)<F.vot)return false;
  if(F.g&&!(e&&e.g&&e.g.includes(F.g)))return false;
  const y=(e&&e.y)||m.y;if(F.y1&&!(y>=+F.y1))return false;if(F.y2&&!(y<=+F.y2))return false;
  if(fd&&!(e&&e.d&&e.d.some(x=>nrm(x).includes(fd))))return false;
  if(fa&&!(e&&e.c&&e.c.some(x=>nrm(x).includes(fa))))return false;return true});
 const abc=(x,y)=>disp(x).localeCompare(disp(y),"es",{sensitivity:"base",numeric:true});
 const yr=m=>(meta(m)&&meta(m).y)||m.y||0;
 if(ORD==="n")a.sort(abc);else if(ORD==="y")a.sort((x,y)=>yr(y)-yr(x)||abc(x,y));else if(ORD==="r")a.sort((x,y)=>(rating(y)??-1)-(rating(x)??-1)||votes(y)-votes(x));else a.sort((x,y)=>(y.a||0)-(x.a||0)||abc(x,y));
 if(T==="e")a.sort((x,y)=>(relOf(x)||"9999").localeCompare(relOf(y)||"9999"));
 if(T==="s")a=a.filter(m=>m.pr).concat(a.filter(m=>!m.pr));return a}
function row(m){const e=meta(m),r=e&&e.ir,sm=[];
 if(m.s==="e"){const rc=e&&e.rc,rd=e&&e.rd;sm.push(rc?`🎬 Cine ${fdate(rc)} · ${left(rc)}`:"🎬 Cine: sin fecha");if(rd)sm.push(`📺 ${fdate(rd)}`)}
 if(m.rec!=null&&m.s!=="e")sm.push("👤 "+(m.rec?esc(m.rec):"Recomendada"));if(m.dl&&SUB!=="d")sm.push("⬇️ Descargar");
 if(ORD==="r"&&F.src!=="imdb"){const x=rating(m);if(x!=null)sm.push(({tmdb:"TMDB",rt:"Rotten",mc:"Metacritic",media:"Media"})[F.src]+" "+f1(x))}
 if(e&&(e.mq==="dud"||e.mq==="no"))sm.push('<span class="warn">⚠️ revisar datos</span>');
 return `<div class="row" data-a="open" data-id="${m.id}">${m.pr&&m.s==="s"?'<span class="ic">🔥</span>':""}${m.fav&&m.s==="v"?'<span class="ic">⭐</span>':""}<div class="t"><b>${esc(disp(m))}</b>${sm.length?`<small>${sm.join(" · ")}</small>`:""}</div>${r!=null?`<span class="nt">${f1(r)}</span>`:""}</div>`}
function cnt(fnc){return S.movies.filter(fnc).length}
function renderTop(){for(const k of["s","v","e"])$("#tb-"+k).classList.toggle("on",T===k);
 $("#tb-s").textContent=`Sin ver (${cnt(m=>m.s==="s"&&!m.dl)})`;$("#tb-v").textContent=`Vistas (${cnt(m=>m.s==="v")})`;$("#tb-e").textContent=`Estrenos (${cnt(m=>m.s==="e")})`;
 const E=T==="e";$("#subs").style.display=E?"none":"";$("#ord").style.display=E?"none":"";$("#fb").style.display=E?"none":"";$("#addb").style.display=E?"none":"";$("#q").placeholder=E?"Buscar estrenos para añadir…":"Buscar título…";
 if(E)return;
 const sb=T==="s"?[["g","Listado",cnt(m=>m.s==="s"&&!m.dl)],["r","Recomendadas",cnt(m=>m.s==="s"&&m.rec!=null)],["d","Descargar",cnt(m=>m.s==="s"&&m.dl)]]:[["t","Todas",cnt(m=>m.s==="v")],["f","Favoritas",cnt(m=>m.s==="v"&&m.fav)],["d","Descargar",cnt(m=>m.s==="v"&&m.dl)]];
 if(!sb.some(x=>x[0]===SUB))SUB=sb[0][0];
 $("#subs").innerHTML=sb.map(([k,l,n])=>`<button class="${SUB===k?"on":""}" data-a="sub" data-k="${k}">${l} · ${n}</button>`).join("");
 $("#ord").value=ORD;const fa=fActive();$("#fb").classList.toggle("on",!!fa);$("#fb").textContent=fa?"Filtros ✓":"Filtros"}
function render(){renderTop();if(T==="e"){renderE();prog();return}const a=list();
 $("#ls").innerHTML=(fActive()||Q?`<p class="hint" style="margin:6px 2px">${a.length} película${a.length===1?"":"s"}${fActive()?` · <button class="lnkb" data-a="fclr" style="font-size:14px">Quitar filtros</button>`:""}</p>`:"")+
  a.slice(0,LIM).map(row).join("")+(a.length>LIM?`<button class="more" data-a="more">Mostrar más (${a.length-LIM})</button>`:"")+
  (!a.length?`<p class="hint">${S.movies.length?"No hay películas aquí.":gs()?"Cargando tus películas…":"Inicia sesión para cargar tus películas."}</p>`:"");prog()}
/* Estrenos */
let UPC=null,UPCL=false,ESR=null,EST=null,ESQ="";
const tmIn=id=>S.movies.find(m=>{const e=M[m.id];return e&&e.tm===id});
function upRow(x){const h=tmIn(x.id);return `<button class="res" data-a="${h?"open":"eadd"}" ${h?`data-id="${h.id}"`:`data-tm="${x.id}"`}>${x.poster_path?`<img src="${IMG}w92${x.poster_path}" alt="">`:'<i class="np"></i>'}<span><b>${esc(x.title)}</b><small>${x.release_date?fdate(x.release_date):"Sin fecha"}${x.original_title&&x.original_title!==x.title?" · "+esc(x.original_title):""}</small></span>${h?`<span class="ok2">✓ ${esc(where(h))}</span>`:'<span class="ok2" style="color:var(--acc);font-size:22px">+</span>'}</button>`}
function renderE(){const mine=list();let h="";
 if(Q.trim()){h+=`<div class="sec">Estrenos que coinciden</div>`;h+=ESR==null?'<p class="hint">Buscando…</p>':ESR.length?`<div style="display:grid;gap:6px">${ESR.map(upRow).join("")}</div>`:'<p class="hint">Sin resultados.</p>'}
 else{h+=`<div class="sec">Mis estrenos (${mine.length})</div>`+(mine.length?mine.map(row).join(""):'<p class="hint">Aún no has añadido ninguno. Elige abajo o busca arriba.</p>');
  h+=`<div class="sec">Próximos estrenos en España</div>`;
  if(!UPC){h+='<p class="hint">Cargando…</p>';loadUpc()}else h+=`<div style="display:grid;gap:6px">${UPC.map(upRow).join("")}</div>`}
 $("#ls").innerHTML=h;refreshRel()}
async function loadUpc(){if(UPCL||!KEYS)return;UPCL=true;
 try{let c;try{c=JSON.parse(localStorage.getItem("pelis-upc"))}catch(e){}
  if(c&&c.d===today()&&Array.isArray(c.r))UPC=c.r;
  else{const t=today(),to=new Date(Date.now()+400*864e5).toISOString().slice(0,10);let r=[];
   for(let pg=1;pg<=5;pg++){const j=await tmdb("/discover/movie",{region:"ES","release_date.gte":t,"release_date.lte":to,with_release_type:"2|3",sort_by:"popularity.desc",page:pg});r=r.concat(j.results||[]);if(pg>=(j.total_pages||1))break}
   const seen=new Set();r=r.filter(x=>!seen.has(x.id)&&seen.add(x.id)).map(x=>({id:x.id,title:x.title,original_title:x.original_title,release_date:x.release_date,poster_path:x.poster_path}));
   r.sort((a,b)=>(a.release_date||"9999").localeCompare(b.release_date||"9999"));UPC=r;try{localStorage.setItem("pelis-upc",JSON.stringify({d:today(),r}))}catch(e){}}}
 catch(e){UPC=[]}finally{UPCL=false}if(T==="e"&&!$("#sh.on"))render()}
let est=null;
function eSearch(){clearTimeout(est);ESR=null;if(!Q.trim())return;const q=Q.trim();est=setTimeout(async()=>{
 try{const nq=nrm(q),loc=(UPC||[]).filter(x=>nrm(x.title).includes(nq)||nrm(x.original_title).includes(nq));
  const r=await tmdb("/search/movie",{query:q});const t=today(),ids=new Set(loc.map(x=>x.id));
  const fut=(r.results||[]).filter(x=>(!x.release_date||x.release_date>=t)&&!ids.has(x.id));
  if(Q.trim()!==q)return;ESR=loc.concat(fut).slice(0,20)}catch(e){ESR=[]}if(T==="e"&&!$("#sh.on"))render()},400)}
function relFrom(d){const out={};const R=(d.release_dates&&d.release_dates.results)||[];const es=R.find(x=>x.iso_3166_1==="ES");
 if(es){const th=es.release_dates.filter(x=>x.type===3||x.type===2).map(x=>x.release_date.slice(0,10)).sort();const dg=es.release_dates.filter(x=>x.type===4).map(x=>x.release_date.slice(0,10)).sort();if(th.length)out.rc=th[0];if(dg.length)out.rd=dg[0]}
 if(!out.rc&&d.release_date&&d.release_date>=today())out.rc=d.release_date,out.rci=1;return out}
let rRun=false;
async function refreshRel(){if(rRun||!KEYS)return;rRun=true;let ch=false;
 try{for(const m of S.movies.filter(m=>m.s==="e")){const e=M[m.id];if(!e||!(e.tm>0))continue;if(e.rdt&&Date.now()-e.rdt<12*36e5)continue;
   try{const d=await tmdb("/movie/"+e.tm,{append_to_response:"release_dates"});const r=relFrom(d);delete e.rc;delete e.rd;delete e.rci;Object.assign(e,r);e.rdt=Date.now();e.v=Date.now();ch=true}catch(z){}}}

function bg(s){s=nrm(s).replace(/ /g,"");const b=[];for(let i=0;i<s.length-1;i++)b.push(s.slice(i,i+2));return b}
function sim(a,b){if(nrm(a)===nrm(b))return 1;const x=bg(a),y=bg(b);if(!x.length||!y.length)return 0;const m=new Map();x.forEach(k=>m.set(k,(m.get(k)||0)+1));let n=0;y.forEach(k=>{const c=m.get(k);if(c){n++;m.set(k,c-1)}});return 2*n/(x.length+y.length)}
const MV=2,YR=/^(19|20)\d\d$/;
function prep(n){n=n.replace(/\bStars? ?Wars\b/i,"Star Wars").replace(/\((lat|vose|v\.?o\.?s?e?)\)/ig,"").replace(/\s+/g," ").trim();
 const segs=n.split(/\s*-\s*/).map(x=>x.trim()).filter(Boolean),ys=segs.filter(x=>YR.test(x));return{n,segs:segs.filter(x=>!YR.test(x)),y:ys.length?+ys[0]:null}}
function queries(raw){const P=prep(raw),n=P.n,q=[n],p=n.match(/^(.*?)\s*\((.*?)\)\s*(.*)$/);if(p)q.push((p[1]+" "+p[3]).trim(),p[2]);
 const sg=P.segs;if(sg.length>1){q.push(sg[sg.length-1],sg.slice(1).join(" "),sg[0],sg.join(" "))}
 q.push(n.replace(/[-,.:;¡!¿?]+/g," "));
 for(const x of q.slice()){const t=x.replace(/^(.*?)\s+\d+\s*$/,"$1");if(t!==x)q.push(t)}
 return[...new Set(q.map(x=>x.replace(/\s+/g," ").trim()).filter(x=>x.length>1&&!YR.test(x)))]}
async function match(m,hint){let best=null;const P=prep(m.n),Y=(hint&&hint.y)||m.y||P.y;
 const qs=hint&&hint.q?[hint.q]:queries(m.n);
 for(const q of qs){let res=(await tmdb("/search/movie",Y?{query:q,year:Y}:{query:q})).results||[];if(!res.length&&Y)res=(await tmdb("/search/movie",{query:q})).results||[];
  const nq=nrm(q),wq=nq.split(" ").length;

   let s=Math.max(sim(q,x.title),sim(q,x.original_title||""),sim(P.n,x.title));

    if(j.Response==="False"){if(/limit/i.test(j.Error||"")){o.blk=true;ocs(o);break}if(/invalid api key/i.test(j.Error||"")){o.blk=true;ocs(o);toast("Clave de OMDb sin activar");break}e.od=Date.now()}

async function seed(){const k=await loadKeys();const r=await fetch("peliculas-seed.bin?v=1");if(!r.ok)throw new Error("seed");const buf=new Uint8Array(await r.arrayBuffer());
