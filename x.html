<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>X</title>
<style>*{box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}html,body{margin:0;background:#000;color:#fff;font:700 14px -apple-system,system-ui,sans-serif}
body{padding:env(safe-area-inset-top,0px) 6px calc(env(safe-area-inset-bottom,0px) + 10px)}

.g{flex:1;grid-auto-rows:1fr;gap:2px}.d{border-radius:8px;min-height:56px;padding:4px;color:#fff;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}

.sheet{background:#fff;color:#111;width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center}
.sheet h3{margin:0 0 6px;font-size:20px}.big{font-size:34px;margin:10px 0}.row{display:flex;gap:10px}.row button,.x{flex:1;font:inherit;border:0;border-radius:12px;padding:14px;background:#111;color:#fff;font-size:22px}.x{width:100%;margin-top:10px;font-size:16px;background:#e9ecef;color:#111}.d.on{background:#F2B632;color:#111}html,body,.top{background:#0B0B0C}.sheet{background:#16161A;color:#F4F1EA}.row button{background:#F2B632;color:#111;font-weight:800}.x{background:#26262C;color:#F4F1EA}.d.t{outline-color:#F2B632}
</style></head><body>
<div class="top"><div class="wd"></div></div><div id="ms"></div>
<div id="dot"></div><div id="sh"><div class="sheet" id="sc"></div></div>
<script>
const SB="https://tdundqjsixqrddszumly.supabase.co",SBK="sb_publishable_KTvtNJcl64iOH4Hee-3L-Q__vSiCgrP";
async function tok(){let s=null;try{s=JSON.parse(localStorage.getItem("gym-session"))}catch(e){}if(!s)return null;if(s.expires_at-60>Date.now()/1000)return s.access_token;
 try{const r=await fetch(SB+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SBK,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})});const j=await r.json();if(!r.ok)return null;const n=JSON.stringify({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(+j.expires_in||3600)});["gym-session","entreno-session"].forEach(k=>localStorage.setItem(k,n));return j.access_token}catch(e){return null}}
function Nube(row,key,emp,onNew,onSt){
 const UK=key+"-at",DK=key+"-dirty";let busy=0,again=0,tm=null;
 const lv=()=>{try{return JSON.parse(localStorage.getItem(key))||emp()}catch(e){return emp()}},lat=()=>+localStorage.getItem(UK)||0,em=v=>Array.isArray(v)?!v.length:!Object.keys(v).length;
 const hd=async j=>{const t=await tok();if(!t)throw new Error("nologin");const h={apikey:SBK,Authorization:"Bearer "+t};if(j){h["Content-Type"]="application/json";h.Prefer="resolution=merge-duplicates,return=minimal"}return h};
 async function put(){const at=lat();const r=await fetch(SB+"/rest/v1/vista_semanal",{method:"POST",headers:await hd(1),body:JSON.stringify({id:row,datos:{v:lv(),updatedAt:at},actualizado_en:new Date().toISOString()})});if(!r.ok)throw new Error("sb "+r.status);if(lat()===at)localStorage.setItem(DK,"0")}
 async function sync(){if(busy){again=1;return}busy=1;let st="ok";
  try{const r=await fetch(SB+"/rest/v1/vista_semanal?id=eq."+row+"&select=datos",{headers:await hd(0)});if(!r.ok)throw new Error("sb "+r.status);
   const rows=await r.json(),rem=rows.length?rows[0].datos:null,ra=+(rem&&rem.updatedAt)||0;let la=lat();const dirty=localStorage.getItem(DK)==="1";
   if(!rem||rem.v==null){if(!em(lv())){if(!la){la=Date.now();localStorage.setItem(UK,String(la))}await put()}}
   else if(dirty||la>ra)await put();
   else if(ra>la){localStorage.setItem(key,JSON.stringify(rem.v));localStorage.setItem(UK,String(ra));localStorage.setItem(DK,"0");onNew&&onNew()}}
  catch(e){st=e.message==="nologin"?"none":"off"}
  busy=0;onSt&&onSt(st==="ok"&&localStorage.getItem(DK)==="1"?"pending":st);if(again){again=0;setTimeout(sync,300)}}
 function changed(){localStorage.setItem(UK,String(Date.now()));localStorage.setItem(DK,"1");onSt&&onSt("pending");clearTimeout(tm);tm=setTimeout(sync,900)}
 return{sync,changed,lv}}
const K="x-estrellas",p2=n=>String(n).padStart(2,"0"),$=s=>document.querySelector(s);
let D={};try{D=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
const DC={ok:"#2e9e4f",pending:"#e0a100",off:"#d33",none:"#555"},X=Nube("x",K,()=>({}),()=>{D=X.lv();draw()},st=>{document.querySelector("#dot").style.background=DC[st]||"#555"});
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}X.changed()};
const iso=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
$(".wd").innerHTML=["L","M","X","J","V","S","D"].map(x=>`<span>${x}</span>`).join("");
const now=new Date(),td=iso(now);
function draw(){const ks=Object.keys(D).filter(k=>D[k]>0).sort();let a=ks.length?new Date(ks[0]+"T00:00"):now;a=new Date(Math.min(a,now));
 let y=a.getFullYear(),mo=a.getMonth(),h="";
 for(;y<now.getFullYear()||(y===now.getFullYear()&&mo<=now.getMonth()+1);){const f=new Date(y,mo,1),n=new Date(y,mo+1,0).getDate(),pre=y+"-"+p2(mo+1)+"-";
  const tot=Object.keys(D).filter(k=>k.startsWith(pre)).reduce((s,k)=>s+(D[k]||0),0);
  h+=`<section class="m" ${y===now.getFullYear()&&mo===now.getMonth()?'id="cur"':""}><h2><span>${f.toLocaleDateString("es-ES",{month:"long",year:"numeric"})}</span><span>★ ${tot}</span></h2><div class="g">`+"<div></div>".repeat((f.getDay()+6)%7);
  for(let i=1;i<=n;i++){const d=pre+p2(i),c=D[d]||0;h+=`<div class="d${c?" on":""}${d===td?" t":""}" data-d="${d}">${i}${c?`<small>${c>6?"★×"+c:"★".repeat(c)}</small>`:""}</div>`}
  h+="</div></section>";if(++mo>11){mo=0;y++}}
 const st=document.scrollingElement.scrollTop;$("#ms").innerHTML=h;if(!draw.o){draw.o=1;const c=$("#cur");if(c)c.scrollIntoView()}else document.scrollingElement.scrollTop=st}
function sheet(d){const c=D[d]||0,q=d.split("-");$("#sc").innerHTML=`<h3>${q[2]}/${q[1]}/${q[0]}</h3><div class="big">${c?"★".repeat(Math.min(c,10))+(c>10?" ×"+c:""):"Sin estrellas"}</div><div class="row"><button data-m="-1">−</button><button data-m="1">+</button></div><button class="x" data-c="1">Cerrar</button>`;$("#sh").classList.add("on");sheet.d=d}
$("#sh").addEventListener("click",e=>{const m=e.target.dataset.m;if(m){const d=sheet.d;D[d]=Math.max(0,(D[d]||0)+ +m);if(!D[d])delete D[d];sv();draw();sheet(d)}else if(e.target.id==="sh"||e.target.dataset.c)$("#sh").classList.remove("on")});
let tm=null,lp=false,sx=0,sy=0;
$("#ms").addEventListener("pointerdown",e=>{const c=e.target.closest(".d");if(!c)return;lp=false;sx=e.clientX;sy=e.clientY;clearTimeout(tm);tm=setTimeout(()=>{lp=true;sheet(c.dataset.d)},500)});
$("#ms").addEventListener("pointermove",e=>{if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>10)clearTimeout(tm)});
$("#ms").addEventListener("pointercancel",()=>clearTimeout(tm));
$("#ms").addEventListener("pointerup",e=>{clearTimeout(tm);const c=e.target.closest(".d");if(!c||lp||Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>10)return;D[c.dataset.d]=(D[c.dataset.d]||0)+1;sv();draw()});
$("#ms").addEventListener("contextmenu",e=>e.preventDefault());
draw();X.sync();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")X.sync()});
</script></body></html>
