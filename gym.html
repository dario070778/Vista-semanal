<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#EEF1F4">
<link rel="apple-touch-icon" href="icono-gym.png">
<title>Gym</title>
<style>
:root{--bg:#EEF1F4;--card:#fff;--ink:#14181F;--mut:#6B7480;--line:#DDE2E8;--acc:#2D5BFF;--ok:#1F9D6B;--bad:#D6453D;--c:#6B7480}
@media(prefers-color-scheme:dark){:root{--bg:#0F1318;--card:#1A2028;--ink:#EEF1F4;--mut:#8A94A1;--line:#2A323C;--acc:#6E8BFF;--ok:#3CC892;--bad:#FF6B63}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.3 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 60px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
main{padding:0 14px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.bar h1{flex:1;margin:0;font-size:24px}
.bar .back{color:var(--acc);font-weight:600;font-size:17px;padding:4px 6px 4px 0}
h2{font-size:15px;font-weight:700;color:var(--mut);margin:22px 2px 8px}
.st{font-size:26px;margin:14px 2px 0;color:var(--c)}
.tc,.hrow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:14px;margin-bottom:8px;border-left:8px solid var(--c);text-align:left;width:100%}
.tc{background:color-mix(in srgb,var(--c) 10%,var(--card))}
.tc .t,.hrow .t{flex:1;min-width:0}
.tc b{font-size:18px;display:block}.hrow b{display:block}
.tc small,.hrow small{color:var(--mut)}
.go{color:var(--c);font-weight:800;font-size:22px}
.ex{background:var(--card);border-radius:16px;padding:12px;margin:12px 0;border-left:8px solid var(--c)}
.ex.fin{display:flex;align-items:center;gap:10px;border-left-color:var(--ok);opacity:.85;cursor:pointer}
.ex.fin .t{flex:1;min-width:0}.ex.fin small{color:var(--mut)}
.ok{color:var(--ok);font-weight:800;font-size:22px}
.eh{display:flex;align-items:center;gap:4px}
.eh b{flex:1;font-size:18px;min-width:0}
.m{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px;align-items:center}
.m em{font-style:normal;font-weight:800;font-size:16px;background:color-mix(in srgb,var(--c) 14%,var(--card));border-radius:10px;padding:3px 9px}
.m small{font-size:12px;font-weight:600;color:var(--mut)}
.plus{font-size:14px;font-weight:700;color:var(--c);padding:3px 10px;border:1.5px dashed var(--c);border-radius:10px}
.last{color:var(--mut);font-size:13px;margin:4px 2px 6px}
.flag{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,#F08C00 20%,var(--card));border:1px solid #F08C00;border-radius:10px;padding:9px 10px;margin:8px 0;font-size:15px}
.x{width:30px;height:30px;color:var(--mut);font-size:17px}
.fl{width:38px;height:38px;display:grid;place-items:center;color:var(--mut)}
.th,.sr{display:grid;grid-template-columns:30px 1fr 1fr 1fr 30px;gap:6px;align-items:center}
.th{font-size:12px;color:var(--mut);font-weight:600;text-align:center;margin:6px 0 4px}
.sr{margin-top:6px}
.sr .n{font-weight:800;color:var(--c);text-align:center}
.sr input{width:100%;font:inherit;font-size:18px;font-weight:700;text-align:center;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 2px;font-variant-numeric:tabular-nums}
.sr input::placeholder{color:var(--mut);font-weight:500;opacity:.6}
.sr input:focus{outline:2px solid var(--c);border-color:transparent}
.pv{grid-column:2/5;margin:-2px 0 0;font-size:13px;color:var(--mut);text-align:left;padding-left:4px}
.pv u{color:var(--c);font-weight:700;margin-left:6px;text-decoration:none}
.add{width:100%;margin-top:8px;padding:11px;border-radius:12px;border:2px dashed var(--line);color:var(--mut);font-weight:600}
.save{width:100%;margin-top:12px;padding:13px;border-radius:12px;background:var(--ok);color:#fff;font-weight:800;font-size:17px}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut);font-weight:600}
.sw i{width:42px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:.15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on i{background:var(--acc)}.sw.on i::after{left:19px}
#sh{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.45);align-items:flex-end}
#sh.on{display:flex}
.sheet{width:100%;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);display:grid;gap:10px}
.sheet h3{margin:0;font-size:20px}
.sheet label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.sheet label.chk{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink)}
.sheet input{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
.sheet input[type=checkbox]{width:24px;height:24px;padding:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{padding:14px;border-radius:14px;background:var(--bg);font-weight:600}
.big.p{background:var(--acc);color:#fff}.big.w{color:var(--bad)}
.hl{padding:8px 0;border-top:1px solid var(--line);font-size:15px}.hl small{color:var(--mut);display:block}
.lgc{width:100%;max-width:340px;background:var(--card);border-radius:18px;padding:20px;display:grid;gap:10px;box-shadow:0 6px 24px #0003}
.lgc h3{margin:0;font-size:22px;text-align:center}.lgc p{margin:0;color:var(--mut);font-size:14px;text-align:center}
.lgc input{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.hint{color:var(--mut);font-size:14px;margin:8px 2px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
</style></head>
<body>
<div id="app"></div><div id="sh"></div><div id="toast"></div>
<script>
const K="gym-v3",$=s=>document.querySelector(s);
const PAL=["#4263EB","#E8590C","#2F9E44","#C2255C","#7048E8","#0C8599","#E67700","#E03131"];
let S,view="home",cur=null,ED=null,EI=null;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FLAG='<svg viewBox="0 0 24 24" width="22" height="22" style="flex:none"><path fill="#F08C00" d="M5 3v18h2v-7h5l1 2h7V5h-6l-1-2z"/></svg>';
const FLAGOFF='<svg viewBox="0 0 24 24" width="22" height="22" style="flex:none"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M5 3v18M5 4h13l-2.5 4 2.5 4H5"/></svg>';
const pad=n=>String(n).padStart(2,"0");
const dayOf=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const today=()=>dayOf(Date.now());
const fdate=ts=>new Date(ts).toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"});
const sdate=ts=>new Date(ts).toLocaleDateString("es-ES",{day:"numeric",month:"numeric"});
const hasD=e=>(e.sets||[]).some(t=>t.kg||t.reps);
const newSet=()=>({kg:"",reps:"",rir:""});
function defTpl(){const X=(name,n,kg,reps,rest,fl)=>({id:uid(),name,n,kg,reps,rest,flag:!!fl,info:[]});return[
{id:uid(),name:"Pecho y espalda",color:"#4263EB",ex:[X("Pecho - Press Banca",4,"60 kg",10,3),X("Espalda - Jalón al pecho",4,"75 kg",10,2,1),X("Pecho - Press Inclinado Mancuernas",3,"25 kg",12,3,1),X("Espalda - Remo en polea baja",4,"80 kg",10,2),X("Pecho - Press Declinado",3,"37,5 kg x lado",12,2),X("Espalda - High Row",3,"40 kg x lado",12,2),X("Pecho - Aperturas en máquina",3,"85 kg",12,2),X("Espalda - Reverse Fly",4,"65 kg",10,2,1)]},
{id:uid(),name:"Bíceps + Tríceps + Hombros",color:"#E8590C",ex:[X("Biceps - Curl mancuernas",3,"15 kg",12,2,1),X("Tríceps - Extensión en polea sobre cabeza",3,"50 kg",12,2,1),X("Biceps - Curl predicador",3,"20 kg",12,2,1),X("Tríceps - Pushdown",3,"45 kg",12,2,1),X("Biceps - Curl martillo",3,"15 kg",12,2),X("Tríceps - Fondos máquina",3,"75 kg",12,2,1),X("Hombros - Press",4,"20 kg",10,2),X("Hombros - Elevación lateral",4,"20 kg + 2,5 kg",10,2),X("Hombro - Remo mentón barra Z",4,"35 kg",10,2),X("Antebrazo - Barra Z agarre inverso",4,"20 kg",12,2)]},
{id:uid(),name:"Pierna",color:"#2F9E44",ex:[X("Prensa",4,"145 kg",10,3,1),X("Gemelos sentado",3,"47,5 kg",12,2,1),X("Extensión Cuádriceps",3,"100 kg",12,2),X("Curl femoral sentado",3,"85 kg",12,2,1),X("Aductores (cierre)",3,"50 kg",12,2),X("Abductores (apertura)",3,"60 kg",12,2),X("Gemelos de pie",3,"55 kg",12,2,1)]}]}
function migrate(o){const n={cmp:o?o.cmp!==false:true,tpl:o&&Array.isArray(o.tpl)?o.tpl:null,draft:{},logs:[]};
 if(o&&Array.isArray(o.sessions))o.sessions.forEach(s=>(s.ex||[]).forEach(e=>{if(hasD(e))n.logs.push({id:uid(),ts:s.ts,day:dayOf(s.ts),tid:s.tid||null,tname:s.group||"",name:e.name,kg:e.kg||"",reps:e.reps||"",sets:e.sets.filter(t=>t.kg||t.reps||t.rir)})}));
 return n}
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
 if(!S||!Array.isArray(S.logs)){let o=null;for(const k of["gym-v2","gym-v1"]){try{o=JSON.parse(localStorage.getItem(k));if(o)break}catch(e){}}S=migrate(o)}
 if(!Array.isArray(S.tpl)||!S.tpl.length)S.tpl=defTpl();if(!S.draft)S.draft={}}
function save(){try{localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(UPD,String(Date.now()));localStorage.setItem(DRT,"1")}catch(e){}queueCloud()}
function draft(T){let d=S.draft[T.id];if(!d||d.day!==today())d=S.draft[T.id]={day:today(),ex:{}};return d}
function dx(T,x){const D=draft(T);return D.ex[x.id]||(D.ex[x.id]={sets:Array.from({length:x.n||3},newSet),fin:false,logId:null})}
function prevOf(x,day){const nm=x.name.trim().toLowerCase();return S.logs.filter(l=>l.day<day&&l.name.trim().toLowerCase()===nm).sort((a,b)=>b.ts-a.ts)[0]||null}
function groups(){const g={};S.logs.forEach(l=>{const k=l.day+"|"+(l.tid||l.tname);const o=g[k]||(g[k]={k,day:l.day,ts:0,tid:l.tid,name:l.tname,logs:[]});o.logs.push(l);o.ts=Math.max(o.ts,l.ts)});return g}
function home(){const hist=Object.values(groups()).sort((a,b)=>b.ts-a.ts);
 $("#app").innerHTML=`<div class="bar"><h1>Gym</h1><button class="back" data-a="menu">Datos</button></div><main><h2>Sesiones</h2>`+
 S.tpl.map(T=>{const l=S.logs.filter(x=>x.tid===T.id).sort((a,b)=>b.ts-a.ts)[0];return `<button class="tc" style="--c:${T.color}" data-a="open" data-id="${T.id}"><div class="t"><b>${esc(T.name)}</b><small>${T.ex.length} ejercicios · ${l?"última vez "+sdate(l.ts):"sin hacer aún"}</small></div><span class="go">›</span></button>`}).join("")+
 `<button class="add" data-a="newtpl">+ Otra sesión</button><h2>Historial</h2>`+
 (hist.length?hist.map(g=>{const T=S.tpl.find(x=>x.id===g.tid);return `<button class="hrow" style="--c:${T?T.color:"#6B7480"}" data-a="hist" data-k="${esc(g.k)}"><div class="t"><b>${esc(g.name)}</b><small>${fdate(g.ts)} · ${g.logs.length} ejercicios guardados</small></div></button>`}).join(""):`<p class="hint">Aquí aparecerán los ejercicios que guardes.</p>`)+`</main>`}
function exBlock(T,x,D){const e=dx(T,x);
 if(e.fin)return `<div class="ex fin" style="--c:${T.color}" data-a="reopen" data-x="${x.id}"><span class="ok">✓</span><div class="t"><b>${esc(x.name)}</b><small>${e.sets.filter(t=>t.kg||t.reps).length} series guardadas · toca para editar</small></div></div>`;
 const p=S.cmp?prevOf(x,D.day):null,first=e.sets[0]&&(e.sets[0].kg||e.sets[0].reps);
 return `<div class="ex"><div class="eh"><b>${esc(x.name)}</b><button class="fl" data-a="flag" data-x="${x.id}" aria-label="Peso nuevo">${x.flag?FLAG:FLAGOFF}</button><button class="x" data-a="edit" data-x="${x.id}" aria-label="Editar ejercicio">✎</button></div>`+
 `<div class="m">${x.kg?`<em>${esc(x.kg)}</em>`:""}${x.reps?`<em>${esc(x.reps)}<small> rep</small></em>`:""}${x.rest?`<em><small>desc. </small>${esc(x.rest)}<small> min</small></em>`:""}${(x.info||[]).map((f,i)=>`<em data-a="info" data-x="${x.id}" data-i="${i}"><small>${esc(f.k)}: </small>${esc(f.v)}</em>`).join("")}<button class="plus" data-a="info" data-x="${x.id}" data-i="-1">+ Info</button></div>`+
 (x.flag&&!first?`<div class="flag">${FLAG}<span><b>Peso nuevo</b>${x.kg?": "+esc(x.kg):""}. Revisa antes de la 1.ª serie.</span></div>`:"")+
 (p?`<div class="last">Última vez: ${sdate(p.ts)}</div>`:"")+
 `<div class="th"><span></span><span>Peso kg</span><span>Reps</span><span>RIR</span><span></span></div>`+
 e.sets.map((t,i)=>{const q=p&&p.sets[i]&&(p.sets[i].kg||p.sets[i].reps)?p.sets[i]:null;
  return `<div class="sr"><span class="n">${i+1}</span>`+
  `<input type="text" inputmode="decimal" data-x="${x.id}" data-i="${i}" data-f="kg" value="${esc(t.kg)}">`+
  `<input type="number" inputmode="numeric" placeholder="${esc(x.reps||"")}" data-x="${x.id}" data-i="${i}" data-f="reps" value="${esc(t.reps)}">`+
  `<input type="number" inputmode="numeric" data-x="${x.id}" data-i="${i}" data-f="rir" value="${esc(t.rir)}">`+
  `<button class="x" data-a="delset" data-x="${x.id}" data-i="${i}" aria-label="Quitar serie">−</button>${q?`<div class="pv">Antes: ${esc(q.kg||"–")} kg × ${esc(q.reps||"–")}${q.rir!==""&&q.rir!=null?" · RIR "+esc(q.rir):""}<u data-a="cp" data-x="${x.id}" data-i="${i}">copiar</u></div>`:""}</div>`}).join("")+
 `<button class="add" data-a="addset" data-x="${x.id}">+ Serie</button><button class="save" data-a="fin" data-x="${x.id}">Guardar ejercicio</button></div>`}
function sess(){const T=S.tpl.find(x=>x.id===cur);if(!T){view="home";return home()}const D=draft(T);
 $("#app").innerHTML=`<div class="bar"><button class="back" data-a="back">‹ Volver</button><span style="flex:1"></span><button class="sw${S.cmp?" on":""}" data-a="cmp"><span>Comparar</span><i></i></button></div><main style="--c:${T.color}"><h1 class="st">${esc(T.name)}</h1><div class="last">${fdate(Date.now())}</div>`+
 T.ex.map(x=>exBlock(T,x,D)).join("")+`<button class="add" data-a="addex">Añadir ejercicio</button><button class="add" data-a="reset">Reiniciar sesión de hoy</button></main>`}
const render=()=>view==="home"?home():sess();
function openSh(h){$("#sh").innerHTML=`<div class="sheet">${h}</div>`;$("#sh").classList.add("on")}
function closeSh(){$("#sh").classList.remove("on");ED=null;EI=null}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1600)}
function sheetEx(x,T){ED=x;const names=[...new Set(S.logs.map(l=>l.name).concat(S.tpl.flatMap(t=>t.ex.map(y=>y.name))))];
 openSh(`<h3>${x?"Editar ejercicio":"Nuevo ejercicio"}</h3><label>Nombre<input id="f-n" list="dl" autocomplete="off" value="${x?esc(x.name):""}" placeholder="Ej. Pecho - Press Banca"></label><datalist id="dl">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist><div class="g2"><label>Series<input id="f-s" type="number" inputmode="numeric" min="1" max="12" value="${x?(x.n||3):4}"></label><label>Reps objetivo<input id="f-r" type="number" inputmode="numeric" value="${x&&x.reps?esc(x.reps):""}"></label></div><div class="g2"><label>Peso objetivo<input id="f-k" type="text" placeholder="60 kg" value="${x?esc(x.kg):""}"></label><label>Descanso (min)<input id="f-d" type="number" inputmode="numeric" value="${x&&x.rest?esc(x.rest):""}"></label></div><button class="big p" data-a="savex">Guardar</button>${x?`<button class="big w" data-a="delx">Quitar ejercicio</button>`:""}<button class="big" data-a="close">Cancelar</button>`)}
function sheetInfo(x,i){EI={x:x.id,i};const f=i>=0?x.info[i]:{k:"",v:""};
 openSh(`<h3>${i>=0?"Editar información":"Nueva información"}</h3><label>Dato<input id="i-k" list="dk" autocomplete="off" value="${esc(f.k)}" placeholder="Ej. Descanso"></label><datalist id="dk">${["Peso","Repeticiones","Descanso","Tempo","Agarre","Banco","Nota"].map(n=>`<option value="${n}">`).join("")}</datalist><label>Valor<input id="i-v" autocomplete="off" value="${esc(f.v)}" placeholder="Ej. 90 s"></label><button class="big p" data-a="saveinfo">Guardar</button>${i>=0?`<button class="big w" data-a="delinfo">Quitar</button>`:""}<button class="big" data-a="close">Cancelar</button>`)}
document.addEventListener("input",ev=>{const t=ev.target,f=t.dataset&&t.dataset.f;if(!f)return;const T=S.tpl.find(y=>y.id===cur),x=T&&T.ex.find(y=>y.id===t.dataset.x);if(x){dx(T,x).sets[+t.dataset.i][f]=t.value;save()}});
document.addEventListener("click",ev=>{
 if(ev.target.id==="sh"){closeSh();return}
 const t=ev.target.closest("[data-a]");if(!t)return;
 const a=t.dataset.a,T=S.tpl.find(y=>y.id===cur),x=T&&T.ex.find(y=>y.id===(t.dataset.x||(EI&&EI.x))),e=T&&x?dx(T,x):null;
 if(a==="open"){cur=t.dataset.id;view="s"}
 else if(a==="back"){view="home"}
 else if(a==="cmp"){S.cmp=!S.cmp}
 else if(a==="newtpl"){const nm=prompt("Nombre de la sesión");if(!nm||!nm.trim())return;const N={id:uid(),name:nm.trim(),color:PAL[S.tpl.length%PAL.length],ex:[]};S.tpl.push(N);cur=N.id;view="s"}
 else if(a==="addex"){sheetEx(null,T);return}
 else if(a==="edit"&&x){sheetEx(x,T);return}
 else if(a==="savex"){const n=$("#f-n").value.trim();if(!n){toast("Pon un nombre");return}
  const k=Math.max(1,Math.min(12,Math.round(+$("#f-s").value)||1)),kg=$("#f-k").value.trim(),rp=$("#f-r").value.trim(),rs=$("#f-d").value.trim();
  if(ED){Object.assign(ED,{name:n,n:k,kg,reps:rp,rest:rs});const d=dx(T,ED);while(d.sets.length<k)d.sets.push(newSet());while(d.sets.length>k&&!(d.sets[d.sets.length-1].kg||d.sets[d.sets.length-1].reps))d.sets.pop()}
  else T.ex.push({id:uid(),name:n,n:k,kg,reps:rp,rest:rs,flag:false,info:[]});
  closeSh()}
 else if(a==="delx"&&ED){const y=ED;closeSh();if(!confirm("¿Quitar «"+y.name+"» de esta sesión?"))return;T.ex=T.ex.filter(z=>z!==y);delete draft(T).ex[y.id]}
 else if(a==="flag"&&x){x.flag=!x.flag}
 else if(a==="info"&&x){sheetInfo(x,+t.dataset.i);return}
 else if(a==="saveinfo"&&x){const k=$("#i-k").value.trim(),v=$("#i-v").value.trim();if(!k){toast("Pon el nombre del dato");return}x.info=x.info||[];const i=EI.i;closeSh();if(i>=0)x.info[i]={k,v};else x.info.push({k,v})}
 else if(a==="delinfo"&&x){const i=EI.i;closeSh();x.info.splice(i,1)}
 else if(a==="close"){closeSh();return}
 else if(a==="addset"&&e){e.sets.push(newSet())}
 else if(a==="delset"&&e){if(e.sets.length<=1){toast("Debe quedar al menos una serie");return}e.sets.splice(+t.dataset.i,1)}
