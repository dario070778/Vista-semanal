<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TV">
<meta name="theme-color" content="#EEF1F4">
<link rel="apple-touch-icon" href="icono-peliculas.png">
<link rel="icon" href="icono-peliculas.png">
<title>TV</title>
<style>
:root{--bg:#EEF1F4;--card:#fff;--mut:#6B7480;--acc:#2D5BFF;--line:#DDE2E8}
@media(prefers-color-scheme:dark){:root{--bg:#0F1318;--card:#1A2028;--mut:#8A94A1;--acc:#6E8BFF;--line:#2A323C}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font:16px/1.3 -apple-system,system-ui,sans-serif}
.bar{position:fixed;left:0;right:0;top:0;z-index:2;background:var(--bg);padding:calc(env(safe-area-inset-top) + 6px) 14px 6px;border-bottom:1px solid var(--line)}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border-radius:14px;padding:4px}
.tb button{font:inherit;border:0;background:none;cursor:pointer;padding:9px 4px;border-radius:11px;font-weight:800;font-size:16px;color:var(--mut)}
.tb button.on{background:var(--acc);color:#fff}
iframe{position:fixed;left:0;right:0;bottom:0;width:100%;border:0;background:var(--bg);display:none}
iframe.on{display:block}
</style>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</head><body>
<div class="bar" id="bar"><div class="tb"><button id="b-p" data-k="p">🎬 Películas</button><button id="b-s" data-k="s">📺 Series</button></div></div>
<iframe id="f-p" title="Películas"></iframe><iframe id="f-s" title="Series"></iframe>
<script>
const SRC={p:"pelis.html",s:"series.html"},$=id=>document.getElementById(id);
let cur;try{cur=localStorage.getItem("tv-tab")}catch(e){}if(cur!=="s")cur="p";
function fit(){const h=$("bar").offsetHeight;for(const k in SRC){const f=$("f-"+k);f.style.top=h+"px";f.style.height=(innerHeight-h)+"px"}}
function load(k){const f=$("f-"+k);if(!f.src)f.src=SRC[k]}
function show(k){cur=k;try{localStorage.setItem("tv-tab",k)}catch(e){}load(k);for(const x in SRC){$("f-"+x).classList.toggle("on",x===k);$("b-"+x).classList.toggle("on",x===k)}}
document.querySelector(".tb").addEventListener("click",e=>{const b=e.target.closest("button");if(b)show(b.dataset.k)});
addEventListener("resize",fit);fit();show(cur);
setTimeout(()=>load(cur==="p"?"s":"p"),1500);
</script></body></html>
