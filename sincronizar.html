<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forzar sincronización</title>
<style>body{font:600 16px -apple-system,system-ui,sans-serif;padding:24px;background:#f1f3f5;color:#111}button{font:inherit;border:0;border-radius:12px;padding:14px 18px;background:#111;color:#fff;width:100%;margin-top:14px}.c{background:#fff;border-radius:14px;padding:14px;margin:10px 0;line-height:1.6}</style></head><body>
<h2>Forzar sincronización</h2>
<div class="c" id="i">Comprobando…</div>
<button id="b">Subir esta versión a la nube</button><p id="m"></p>
<script>
const SB="https://tdundqjsixqrddszumly.supabase.co",SBK="sb_publishable_KTvtNJcl64iOH4Hee-3L-Q__vSiCgrP";
const J=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};
async function tok(){const s=J("gym-session")||J("entreno-session");if(!s)return null;if(s.expires_at-60>Date.now()/1000)return s.access_token;
 const r=await fetch(SB+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SBK,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})});const j=await r.json();if(!r.ok)return null;
 const n=JSON.stringify({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(+j.expires_in||3600)});["gym-session","entreno-session"].forEach(k=>localStorage.setItem(k,n));return j.access_token}
const cnt=(g,e)=>({gw:g&&g.wo?g.wo.filter(w=>String(w.id).startsWith("imp-")&&w.type==="w").length:0,gc:g&&g.wo?g.wo.filter(w=>String(w.id).startsWith("imp-c-")).length:0,st:g&&g.steps?g.steps.length:0,fb:e&&e.hist?e.hist.filter(h=>String(h.id).startsWith("imp-fb-")).length:0});
async function remoto(id,t){const r=await fetch(SB+"/rest/v1/vista_semanal?id=eq."+id+"&select=datos",{headers:{apikey:SBK,Authorization:"Bearer "+t}});if(!r.ok)throw new Error("sb "+r.status);const x=await r.json();return x.length?x[0].datos.state:null}
(async()=>{const g=J("gym-v3"),e=J("entreno-v2"),a=cnt(g,e);let h="<b>En este navegador</b><br>Gym importadas: "+a.gw+" · Cardio: "+a.gc+" · Días de pasos/calorías: "+a.st+" · Full body: "+a.fb;
 try{const t=await tok();if(!t)throw new Error("Sin sesión: abre la app e inicia sesión");const rg=await remoto("gym",t),re=await remoto("entreno",t),b=cnt(rg,re);
  h+="<br><br><b>En la nube</b><br>Gym importadas: "+b.gw+" · Cardio: "+b.gc+" · Días de pasos/calorías: "+b.st+" · Full body: "+b.fb}catch(x){h+="<br><br>Nube: "+x.message}
 if(!g)h+="<br><br>⚠️ Aquí no hay datos de Gym: ábrelo desde el mismo sitio que la app.";
 document.getElementById("i").innerHTML=h})();
document.getElementById("b").onclick=async()=>{const m=document.getElementById("m");try{const g=J("gym-v3"),e=J("entreno-v2");if(!g||!Array.isArray(g.logs))throw new Error("No hay datos de Gym en este navegador");
 const t=await tok();if(!t)throw new Error("Sin sesión: abre la app e inicia sesión");const at=Date.now();
 const put=async(id,st,k)=>{const r=await fetch(SB+"/rest/v1/vista_semanal",{method:"POST",headers:{apikey:SBK,Authorization:"Bearer "+t,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id,datos:{state:st,updatedAt:at},actualizado_en:new Date().toISOString()})});if(!r.ok)throw new Error(id+": sb "+r.status);localStorage.setItem(k+"-updated-at",String(at));localStorage.setItem(k+"-dirty","0")};
 await put("gym",g,"gym");if(e&&Array.isArray(e.routines))await put("entreno",e,"entreno");
 m.textContent="Listo: subido a la nube. Recarga la app."}catch(x){m.textContent="Error: "+x.message}};
</script></body></html>
